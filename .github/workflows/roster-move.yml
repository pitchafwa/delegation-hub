name: Roster move (button on the site)

# One-tap moves: the Do now card's button dispatches this with the add / drop / kind of a planned move and a request id, using the GitHub token Tommy pasted into his
# own browser for Set lineup. research/roster_move.py re-checks the move against the newest plan and ESPN, sends ONE transaction (add + drop together), verifies it,
# and writes move_result.json + moves_log.json to the throwaway `move-data` branch, which the site polls. A successful move starts a plan rebuild.
on:
  workflow_dispatch:
    inputs:
      add:
        description: "ESPN id of the player to add"
        required: true
      drop:
        description: "ESPN id of the player to drop (blank = none)"
        default: ""
      kind:
        description: "fa | waiver"
        default: "fa"
      rid:
        description: "request id from the site"
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: roster-move
  cancel-in-progress: false

jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/roster-move.yml

      - name: Install dependencies
        run: pip install --quiet espn-api pandas python-dotenv requests

      - name: Carry over the move log
        run: |
          mkdir -p move_out
          git fetch -q origin move-data || true
          if git rev-parse -q --verify origin/move-data >/dev/null; then
            git show origin/move-data:moves_log.json > move_out/moves_log.json 2>/dev/null || true
          fi

      - name: Make the move
        id: move
        working-directory: ingest
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          IN_ADD: ${{ inputs.add }}
          IN_DROP: ${{ inputs.drop }}
          IN_KIND: ${{ inputs.kind }}
          IN_RID: ${{ inputs.rid }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python research/roster_move.py --add "$IN_ADD" --drop "$IN_DROP" --kind "$IN_KIND" --rid "$IN_RID" --out "$GITHUB_WORKSPACE/move_out" --run-url "$RUN_URL"

      - name: Publish result
        if: always()
        run: |
          if [ -d move_out ] && [ -n "$(ls -A move_out)" ]; then
            cd move_out
            git init -q -b move-data
            git config user.name "move-bot"
            git config user.email "move-bot@users.noreply.github.com"
            git add .
            git commit -q -m "roster move"
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
            git push -q -f origin move-data
          fi

      - name: Rebuild the plan after a move
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run refresh-gameday.yml --ref main || echo "dispatch failed"
