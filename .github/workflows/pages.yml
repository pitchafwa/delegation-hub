name: Deploy dashboard (GitHub Pages + Cloudflare)

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/pages.yml"
      - "src/**"
      - "wrangler.jsonc"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # stamp the deployed page with this commit so a stale cached copy can detect it and reload itself once
      - name: Stamp build id
        run: sed -i "s/__BUILD__/${GITHUB_SHA::12}/" dashboard/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - id: deployment
        uses: actions/deploy-pages@v4

  # Same site on Cloudflare (delegation-hub.tommy-valtin.workers.dev): static files from dashboard/ plus src/worker.js (/api/*).
  # Needs the repo secret CLOUDFLARE_API_TOKEN (Tommy adds it); skipped with a note until it exists.
  cloudflare:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1f00ed93c4886579cdff70413c48ead4
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build id
        run: sed -i "s/__BUILD__/${GITHUB_SHA::12}/" dashboard/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy to Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::notice::CLOUDFLARE_API_TOKEN secret not set; skipping the Cloudflare deploy"; exit 0; fi
          npx --yes wrangler@4 deploy
