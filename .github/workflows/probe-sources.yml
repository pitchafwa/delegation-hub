name: Probe data sources (temporary)

# One-off test (2026-10-29): which of the daily refresh's data sources answer from GitHub's servers. Deleted after it runs.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet nba_api requests
      - name: Probe
        run: |
          python - <<'EOF'
          import time, requests
          def t(label, fn):
              t0 = time.time()
              try:
                  r = fn()
                  print(f"OK   {label}: {r} ({time.time()-t0:.1f}s)")
              except Exception as e:
                  print(f"FAIL {label}: {repr(e)[:150]} ({time.time()-t0:.1f}s)")
          from nba_api.stats.endpoints import leaguegamelog, boxscoretraditionalv3
          t("stats.nba.com game log (nba_api)", lambda: len(leaguegamelog.LeagueGameLog(season="2026-27", player_or_team_abbreviation="P", timeout=60).get_data_frames()[0]))
          t("stats.nba.com box score v3 (nba_api)", lambda: len(boxscoretraditionalv3.BoxScoreTraditionalV3(game_id="0022600009", timeout=60).get_data_frames()[0]))
          t("cdn.nba.com live box score", lambda: requests.get("https://cdn.nba.com/static/json/liveData/boxscore/boxscore_0022600009.json", timeout=30).status_code)
          t("NBA injury report PDF", lambda: requests.get("https://ak-static.cms.nba.com/referee/injury/Injury-Report_2026-10-28_05_00PM.pdf", timeout=30).status_code)
          t("ESPN scoreboard", lambda: len(requests.get("https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard", params={"dates": "20261026"}, timeout=30).json().get("events", [])))
          t("ESPN game summary (box score)", lambda: len(requests.get("https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary", params={"event": "401809233"}, timeout=30).json().get("boxscore", {}).get("players", [])))
          t("DailyFantasyFuel", lambda: requests.get("https://www.dailyfantasyfuel.com/nba/projections/draftkings", headers={"User-Agent": "Mozilla/5.0"}, timeout=30).status_code)
          t("Hashtag Basketball", lambda: requests.get("https://hashtagbasketball.com/keeper", headers={"User-Agent": "Mozilla/5.0"}, timeout=30).status_code)
          EOF
