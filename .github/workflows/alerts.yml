name: Phone alerts (ntfy)

# PRIMARY trigger is cron-job.org calling the workflow_dispatch API (see alerts/SETUP.md): GitHub's own scheduler is best-effort and drops or delays runs.
# The schedule below is only a BACKUP; a shared state file (alerts/state.json) and the one-run-at-a-time rule stop duplicate notifications.
# Backup times use odd minutes on purpose (round minutes are the most delayed). The script itself only sends the daily brief between 8:25am and noon ET,
# the weekly brief between 9:25am and 1pm ET on the first day of a matchup, and never repeats a notification.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check | lineup | daily | weekly | test"
        default: "check"
  schedule:
    - cron: "17,47 12-23 * * *"
    - cron: "17,47 0-2 * * *"

permissions:
  contents: write
  actions: write      # to start a plan rebuild after a roster move or a skipped scheduled build

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/alerts.yml

      - name: Install dependencies
        run: pip install --quiet espn-api pandas python-dotenv requests pdfplumber

      - name: Run
        id: run
        working-directory: ingest
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python research/alerts.py check || true
            python research/alerts.py lineup || true
            python research/alerts.py daily || true
            python research/alerts.py weekly || true
          else
            python research/alerts.py "${{ inputs.mode }}"
          fi

      # alerts.py check writes rebuild_request.txt when Tommy's ESPN roster no longer matches the plan (he made a move) or a scheduled plan build was skipped
      - name: Rebuild the plan if needed
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f ingest/rebuild_request.txt ]; then
            echo "Rebuilding the plan: $(cat ingest/rebuild_request.txt)"
            gh workflow run refresh-gameday.yml --ref main || echo "dispatch failed"
          fi
          if [ -f ingest/league_request.txt ]; then
            echo "Starting the morning league refresh (GitHub's schedule is late)"
            gh workflow run refresh-league.yml --ref main || echo "dispatch failed"
          fi

      # Live matchup tracker: score, expected rest of the week, win probability. Published to a throwaway branch (one commit, force-pushed) so the site is not rebuilt.
      - name: Live matchup
        if: github.event_name == 'schedule' || inputs.mode == 'check' || inputs.mode == 'lineup'      # every 5 minutes on game days, so the score and win chance move with the games
        working-directory: ingest
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python research/live_matchup.py || true

      # Alert log for the site (More > Alerts): the last 30 days of alerts from the ledger + when this check ran and whether it worked
      - name: Alert log
        if: always()
        working-directory: ingest
        env:
          RUN_OK: ${{ steps.run.outcome }}
        run: python research/alert_log.py || true

      - name: Publish live data
        if: always()
        run: |
          if ls ingest/live_out/*.json >/dev/null 2>&1; then
            cd ingest/live_out
            git init -q -b live-data
            git config user.name "alerts-bot"
            git config user.email "alerts-bot@users.noreply.github.com"
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
            # keep every published file this run did not write (2026-11-26: on a no-games day the tracker wrote nothing, and publishing only the alert log
            # wiped live_matchup.json, so Today lost the earlier days of the matchup and the tracker could not read its own history back)
            if git fetch -q --depth 1 origin live-data; then
              for f in $(git ls-tree --name-only FETCH_HEAD); do [ -f "$f" ] || git checkout -q FETCH_HEAD -- "$f"; done
            fi
            git add *.json
            git commit -q -m "live data"
            git push -q -f origin live-data
          fi

      - name: Save state
        run: |
          git config user.name "alerts-bot"
          git config user.email "alerts-bot@users.noreply.github.com"
          git add alerts/state.json ledger 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "alerts state" --quiet
            git pull --rebase --quiet
            git push --quiet
          fi
