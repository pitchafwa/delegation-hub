name: Site setting (value horizon slider on the site)

# The value-horizon slider (More > Settings, and the Dynasty board) dispatches this with the GitHub token Tommy pasted into his own browser. It saves the setting in
# dashboard/site_settings.json, re-picks every player's asset value at that horizon in hub_data.json (apply_horizon.py: the nightly build already stores every
# horizon). No plan rebuild (2026-11-12, Tommy): the horizon only moves which players count as protected keepers; the next scheduled plan run (4 a day)
# and the morning trade board pick it up. One run at a time; a newer setting simply lands on top.
on:
  workflow_dispatch:
    inputs:
      horizon:
        description: "seasons counted in asset value (1-10)"
        required: true

permissions:
  contents: write

concurrency:
  group: site-setting
  cancel-in-progress: false

jobs:
  setting:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Save the setting and re-pick asset values
        working-directory: ingest
        env:
          IN_H: ${{ inputs.horizon }}
        run: |
          case "$IN_H" in ''|*[!0-9]*) echo "bad horizon: $IN_H"; exit 1;; esac
          git config user.name "plan-bot"
          git config user.email "plan-bot@users.noreply.github.com"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            python research/apply_horizon.py --set "$IN_H"
            git add ../dashboard/site_settings.json ../dashboard/hub_data.json
            git diff --cached --quiet && break
            git commit -q -m "Site setting: value horizon $IN_H seasons"
            git push -q origin HEAD:main && break
            sleep $((i * 3))
          done
