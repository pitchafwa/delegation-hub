name: Set lineup (button on the site)

# Triggered by the "Set lineup in ESPN" panel on the This week tab (workflow_dispatch with a GitHub token Tommy pastes into his own browser once; nothing is stored in the
# page source). `preview` rebuilds the lineup preview from the newest plan and ESPN's current lineups; `apply` applies exactly the preview whose hash he reviewed (it refuses if the
# plan or his lineup changed since). Output goes to the throwaway `lineup-data` branch (like the live matchup tracker's `live-data`), so the site is not rebuilt.
# ESPN_S2 / SWID are the same repository secrets the other workflows use.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview | apply"
        default: "preview"
      hash:
        description: "preview hash being applied (apply only)"
        default: ""

permissions:
  contents: write

concurrency:
  group: set-lineup
  cancel-in-progress: false

jobs:
  lineup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/set-lineup.yml

      - name: Install dependencies
        run: pip install --quiet espn-api pandas python-dotenv requests

      - name: Run
        id: run
        working-directory: ingest
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: |
          python research/set_lineup.py --mode "${{ inputs.mode }}" --hash "${{ inputs.hash }}" --out "$GITHUB_WORKSPACE/lineup_out" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Publish result
        if: always()
        run: |
          if [ -d lineup_out ] && [ -n "$(ls -A lineup_out)" ]; then
            cd lineup_out
            git init -q -b lineup-data
            git config user.name "lineup-bot"
            git config user.email "lineup-bot@users.noreply.github.com"
            git add .
            git commit -q -m "lineup ${{ inputs.mode }}"
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
            git push -q -f origin lineup-data
          fi
