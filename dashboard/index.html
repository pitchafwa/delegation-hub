    pane.innerHTML=`<div class="controls"><span class="hint">Keepers ${dlTxt}. ${M.real?'ESPN shows the real keepers now.':'Other teams\' keepers are <b>projected</b> (each team\'s top 3 by asset) until ESPN records them.'}</span></div>
      <div class="controls" style="gap:1rem"><label class="kbox" style="gap:.5rem"><span>Keepers to choose:</span><select id="kK">${[3,5].map(n=>`<option value="${n}" ${n===K?'selected':''}>${n}${n===(DR.draft.keepers_now||3)?' (this year)':' (future years)'}</option>`).join('')}</select></label>
        <label class="kbox" style="gap:.5rem;flex:1;min-width:220px"><span>Win now</span><input type="range" id="kW" min="0" max="0.6" step="0.05" value="${kW}" style="flex:1"/><span>Future</span><b id="kWv">${kW.toFixed(2)}</b></label>
        ${sel.length?'<button class="dbtn" id="kReset" type="button">Use the recommended set</button>':''}</div>
      <div class="statbar" style="margin-bottom:1rem"><div><b>${active.sim?active.sim.season.toFixed(0):'—'}</b>expected season points (with the draft)</div><div><b>${active.sim?active.sim.future.toFixed(0):'—'}</b>next-year top-5 asset total</div>
        <div><b>${active.total.toFixed(0)}</b>total (w = ${kW.toFixed(2)})</div><div><b style="color:${gap<-0.5?'var(--warn)':'var(--good)'}">${gap<-0.5?gap.toFixed(0):'best'}</b>${gap<-0.5?'vs the best set':'your set is the best found'}</div></div>
      ${sel.length&&sel.length<K?`<div class="legend" style="margin:0 0 1rem">You have ${sel.length} of ${K} ticked: tick ${K-sel.length} more to see your set compared with the best. Until then the numbers above are for the best set.</div>`:''}
      ${sel.length===K&&active!==best?`<div class="legend" style="margin:0 0 1rem"><b>Your set vs the best:</b> ${active.S.map(p=>esc(p.name)).join(', ')} is ${Math.abs(gap).toFixed(0)} points behind ${best.S.map(p=>esc(p.name)).join(', ')} on this weighting.</div>`:''}
      <div style="font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin:.4rem 0">Your roster: tick ${K} to keep</div>
      <div class="tablewrap" style="margin-bottom:1.2rem"><table class="kTbl"><thead><tr><th class="cbh">Keep</th><th style="text-align:left">Player</th><th>Age</th><th style="text-align:left">Pos</th><th>ESPN proj</th><th>Adj proj</th><th>Asset</th><th>MKT</th><th style="text-align:left">Injury risk</th><th style="text-align:left">If not kept: chance other teams leave him at your pick</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin:.4rem 0">Best keeper sets (each with a simulated draft)</div>
      <div class="tablewrap" style="margin-bottom:1rem"><table><thead><tr><th>Rank</th><th style="text-align:left">Keepers</th><th>Season pts</th><th>Future assets</th><th>Total</th><th>Gap</th></tr></thead><tbody>${setRows}</tbody></table></div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin:.4rem 0">Does the answer change with the weighting?</div>
      <div class="irBox">${sens}</div>
      ${draftHtml?`<div style="font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin:.4rem 0">Who this set drafts (simulated)</div><div class="irBox">${draftHtml}</div>`:''}
      <div class="legend" style="margin-top:1rem"><b>How to use this page.</b> Tick the keepers you are considering (the page starts from the best set it found). <b>Adj proj</b> is ESPN's projected points per game times the games he is expected to be available (injury tier model). <b>Season pts</b> = your best lineup (10 slots, position-eligible) from the keepers plus the players a simulated draft gives you at your picks, times 73 games. <b>Future assets</b> = the top-5 next-year keeper asset values in that group. <b>Total</b> adds season points and the future weight (the slider: the same 1 asset point = 73 points of output used elsewhere). "Chance other teams leave him at your pick" is for a player you would NOT keep: whether you could draft him back (it counts only the other teams' picks). Pick labels are draft round and slot: Rd 1.1 is your first pick. If he is likely gone, keeping him is the only way to hold him. Other teams' keepers are projected until ESPN shows them, so re-check after the deadline; the simulation uses each owner's draft tendencies but cannot know surprises.</div>`;
    document.getElementById('kK').addEventListener('change',e=>{ kK=+e.target.value; kSel=null; try{localStorage.removeItem('keepSel');}catch(_){} renderKeepers(); });
    const kw=document.getElementById('kW'); kw.addEventListener('input',e=>{ document.getElementById('kWv').textContent=(+e.target.value).toFixed(2); });
    kw.addEventListener('change',e=>{ kW=+e.target.value; renderKeepers(); });
    const rs=document.getElementById('kReset'); if(rs) rs.addEventListener('click',()=>{ kSel=null; try{localStorage.removeItem('keepSel');}catch(_){} renderKeepers(); });
    pane.querySelectorAll('.kcb').forEach(cb=>cb.addEventListener('change',e=>{
      const cur=new Set(sel.length?sel:active.S.map(p=>p.id)); if(e.target.checked) cur.add(e.target.dataset.id); else cur.delete(e.target.dataset.id);
      kSel=[...cur].slice(0,K); if(cur.size>K){ kSel=[...cur].slice(-K); } try{localStorage.setItem('keepSel',JSON.stringify(kSel));}catch(_){} renderKeepers(); }));
    mobileTables(pane); collapseLegends(pane);
  };
  setTimeout(run,30);
}

let dLimit=60;
async function pollDraftLive(){
  try{
    if(window.__noLive) return;
    const r=await fetch('draft_live.json?_='+Date.now()); if(!r.ok){ window.__noLive=true; return; } const j=await r.json();
    if(!j.picks) return; dLive=true; let changed=false;
    const byN=new Map(j.picks.map(x=>[x.n,x]));
    DR.draft.picks.forEach(x=>{ const y=byN.get(x.n); if(y&&(y.player!==x.player||y.keeper!==x.keeper)){ x.player=y.player; x.keeper=y.keeper; changed=true; } });
    DR.draft.in_progress=!!j.inProgress;
    if(changed&&document.getElementById('draftPane').style.display!=='none') renderDraft();
  }catch(e){}
}

function renderAbout(){
  document.getElementById('aboutPane').innerHTML = `
    <h2>What changed</h2>
    <p>This used to be a prospect ranking board -- a model trying to predict which rookies would become elite fantasy contributors, graded against a percentile score. After an exhaustive search (hand-built formulas, purpose-built ranking ML, tree ensembles, all validated on genuinely unseen draft classes), <b>nothing beat simply trusting real draft position</b> at that specific task. Rather than keep a ranking that can't out-perform what NBA front offices already collectively know, this hub was rebuilt around a different, more useful question: <b>given a prospect's real profile, what does a grounded multi-year trajectory and value estimate actually look like -- on the exact same scale as a real player already on your roster?</b></p>
    <div class="warn-box">This does <b>not</b> claim to out-scout anyone. It's a data-grounded projection, not a "this player will be a star" call. Regularized models like this one systematically <b>undershoot true outliers</b> -- Wembanyama, Doncic, and Cooper Flagg's early real production all ran ahead of their model projections. Treat the numbers as a floor-ish, defensible baseline, not a ceiling.</div>

    <h2>How the numbers are built</h2>
    <p><b>Current players</b> use the same validated Kalman-filter engine as the rest of this league's valuation model: a separately-fit aging curve per stat (points, rebounds, assists, blocks, turnovers, 3PM, FTM, FTA, minutes), continuously updated against real game logs.</p>
    <p><b>Prospects</b> (nobody in the NBA yet, or very early in their rookie year) don't have real game history to filter against. Instead, a real regression model ("Output B") projects their expected rookie-season per-minute rates directly from their pre-NBA profile -- college or international production, recruiting rank, combine testing, draft position -- validated against 704 real college rookies (2010-2025) and, separately, 52 real international rookies. That projection becomes the starting point, then ages forward using the exact same per-stat curves used for real players.</p>
    <p>Real, honest validation numbers (R² over a "same number for every rookie" baseline, cross-validated by draft class): assists +0.52, rebounds +0.45, minutes +0.37, threes +0.38, blocks +0.28 (college); assists +0.64, blocks +0.57, rebounds +0.44 (international, smaller n=52 sample -- directional). <b>Steals has no real signal in either model</b> (consistent with an earlier, separate finding that even a full in-season Kalman filter for steals lost to a flat career rate) -- treat that one number skeptically.</p>

    <h2>VOR and the keeper slider</h2>
    <p>Value over opportunity cost: how much better a player's projected trajectory is than what you'd get back drafting fresh instead, summed year-by-year, stopping at the first season the trajectory dips below that bar. The opportunity-cost curve itself is fit from this league's own real keeper history, and depends on how many keepers exist league-wide -- drag the slider to see value shift for a shallower or deeper keeper format.</p>

    <h2>Known gaps, disclosed</h2>
    <ul>
      <li>International prospects: smaller training sample (52 rookies) and a cruder feature set (no play-by-play advanced stats equivalent to college's) -- flagged with ⚠ in the detail view.</li>
      <li>Triple-doubles aren't projected for prospects (no real prior exists pre-NBA) -- defaulted out rather than guessed.</li>
      <li>Steals: essentially unpredictable from any static profile tested so far, in-season or pre-draft.</li>
      <li>True outlier talents get undershot by design (regularization pulls toward the typical case).</li>
    </ul>`;
}

/* Two-level navigation: four groups on the bottom bar (phones) or top bar, and a row of sub-tabs for the active group.
   The original seven view buttons stay in a hidden #segView that still owns the panes; the nav just presses them. */
const NAV=[['week','Week',[['week','This week']]],['players','Players',[['board','Dynasty'],['redraft','Redraft'],['keepers','Keepers'],['draft','Draft']]],['league','League',[['teams','Teams'],['trades','Trades'],['sched','Schedule']]],['about','About',[['about','About']]]];
const lastInGroup={};
function renderNav(){
  const btn=v=>document.querySelector(`#segView button[data-v="${v}"]`);
  const avail=v=>{const b=btn(v); return !!b&&b.style.display!=='none';};
  const pressed=document.querySelector('#segView button[aria-pressed="true"]');
  const act=pressed?pressed.dataset.v:'week';
  const grp=NAV.find(g=>g[2].some(x=>x[0]===act))||NAV[0];
  lastInGroup[grp[0]]=act;
  const top=document.getElementById('navTop'), sub=document.getElementById('navSub'), wrap=document.getElementById('navSubWrap');
  if(!top) return;
  top.innerHTML=NAV.filter(g=>g[2].some(x=>avail(x[0]))).map(g=>`<button data-g="${g[0]}" aria-pressed="${g===grp}">${g[1]}</button>`).join('');
  const views=grp[2].filter(x=>avail(x[0]));
  sub.innerHTML=views.map(x=>`<button data-v="${x[0]}" aria-pressed="${x[0]===act}">${x[1]}</button>`).join('');
  wrap.style.display=views.length>1?'':'none';
}
document.addEventListener('click',e=>{
  const g=e.target.closest('#navTop button'), v=e.target.closest('#navSub button');
  if(g){ const grp=NAV.find(x=>x[0]===g.dataset.g); const b0=document.querySelector(`#segView button[data-v="${lastInGroup[grp[0]]||grp[2][0][0]}"]`);
    const ok=b0&&b0.style.display!=='none'?b0:grp[2].map(x=>document.querySelector(`#segView button[data-v="${x[0]}"]`)).find(b=>b&&b.style.display!=='none'); if(ok) ok.click(); }
  if(v){ const b=document.querySelector(`#segView button[data-v="${v.dataset.v}"]`); if(b) b.click(); }
});
function wire(){
  document.getElementById('segView').addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b) return;
    const READY={week:()=>!!W,sched:()=>!!SP,board:()=>!!D,redraft:()=>!!RD,teams:()=>!!(D&&L),trades:()=>!!(D&&TR),draft:()=>!!(D&&DR),keepers:()=>!!(D&&DR),about:()=>true};
    if(READY[b.dataset.v]&&!READY[b.dataset.v]()){
      [...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed', x===b));
      ['board','redraft','about','teams','week','trades','sched','draft','keepers'].forEach(k=>{ const el=document.getElementById(k+'Pane'); if(el) el.style.display=(k===b.dataset.v)?'':'none'; });
      const pn=document.getElementById(b.dataset.v+'Pane'); if(pn&&!pn.innerText.trim()) pn.innerHTML='<div class="hint" style="padding:1rem">Loading…</div>';
      renderNav(); return;
    }
    [...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed', x===b));
    document.getElementById('boardPane').style.display = b.dataset.v==='board' ? '' : 'none';
    document.getElementById('redraftPane').style.display = b.dataset.v==='redraft' ? '' : 'none';
    if(b.dataset.v==='redraft') renderRedraft();
    document.getElementById('aboutPane').style.display = b.dataset.v==='about' ? '' : 'none';
    document.getElementById('teamsPane').style.display = b.dataset.v==='teams' ? '' : 'none';
    document.getElementById('weekPane').style.display = b.dataset.v==='week' ? '' : 'none';
    document.getElementById('tradesPane').style.display = b.dataset.v==='trades' ? '' : 'none';
    document.getElementById('schedPane').style.display = b.dataset.v==='sched' ? '' : 'none';
    if(b.dataset.v==='sched') renderSchedule();
    document.getElementById('draftPane').style.display = b.dataset.v==='draft' ? '' : 'none';
    document.getElementById('keepersPane').style.display = b.dataset.v==='keepers' ? '' : 'none';
    if(b.dataset.v==='keepers') renderKeepers();
    if(b.dataset.v==='draft') renderDraft();
    if(b.dataset.v==='trades') renderTrades();
    if(b.dataset.v==='week') renderWeek();
    if(b.dataset.v==='about') renderAbout();
    if(b.dataset.v==='teams') renderTeams();
    if(b.dataset.v==='board' && D) render();
    try{localStorage.setItem('hubView',b.dataset.v);}catch(e){}
    renderNav(); window.scrollTo(0,0);
  });
  document.getElementById('segKind').addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b) return;
    [...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed', x===b));
    kind=b.dataset.v; document.getElementById('brkCtl').style.display = kind==='breakout'?'flex':'none'; if(kind==='breakout'){sort={k:'p_break',asc:false};} else if(['p_break','edge_fpg','adp','brk_tier','fpg_last','fpg_next','hit','p_bust','proj_fpg','proj_gp','edge_total','vor_brk'].includes(sort.k)){sort={k:'asset',asc:false};} render();
  });
  document.getElementById('brkYear').addEventListener('change', async e=>{
    brkYear=e.target.value;
    if(brkYear!=='live' && !H){ H=await fetch('breakout_history.json',{cache:'no-cache'}).then(r=>r.json()); fillYearSelect(); }
    sort={k:'p_break',asc:false}; render();
  });
  document.getElementById('segBrk').addEventListener('click', e=>{
    const b=e.target.closest('button'); if(!b) return;
    [...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed', x===b));
    brkType=b.dataset.v; sort = brkType==='radar' ? {k:'edge_fpg',asc:false} : brkType==='bust' ? {k:'p_bust',asc:false} : {k:'p_break',asc:false}; render();
  });
  document.getElementById('sortSel').addEventListener('change', e=>{ sort.k=e.target.value; sort.asc=(sort.k==='player'||sort.k==='age'); render(); });
  document.getElementById('sortDir').addEventListener('click', ()=>{ sort.asc=!sort.asc; render(); });
  document.getElementById('q').addEventListener('input', e=>{ q=e.target.value; render(); });
  document.getElementById('kSlider').addEventListener('input', e=>{ K=+e.target.value; document.getElementById('kNum').value=K; render(); });
  document.getElementById('kNum').addEventListener('input', e=>{
    let v=+e.target.value; if(!Number.isFinite(v)) return;
    v=Math.max(0,Math.min(19,Math.round(v)));
    K=v; document.getElementById('kSlider').value=K; render();
  });
  document.getElementById('hrow').addEventListener('click', e=>{
    const th=e.target.closest('th'); if(!th || th.dataset.sortable==='false' || !th.dataset.k) return;
    if(sort.k===th.dataset.k) sort.asc=!sort.asc; else {sort.k=th.dataset.k; sort.asc=false;}
    render();
  });
  document.getElementById('body').addEventListener('click', e=>{
    if(e.target.closest('#moreBtn')){ rowLimit+=60; render(); return; }
    const tr=e.target.closest('tr[data-id]'); if(!tr) return;
    const id=tr.dataset.id;
    if(open.has(id)) open.delete(id); else open.add(id);
    render();
  });
}

/* Load order: the tab bar is wired at once and This week (small file) is fetched first and shown as soon as it arrives; the 2.4 MB board data loads in
   parallel and everything else after it. If the weekly plan is unavailable, fall back to the Board. */
wire();
renderNav();
(function(){ try{ const mine=(document.querySelector('meta[name=build]')||{}).content; const UNSTAMPED='__'+'BUILD__'; if(!mine||mine===UNSTAMPED) return;
  fetch('index.html?_='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(h=>{ const m=h.match(/<meta name="build" content="([^"]+)"/); if(m&&m[1]!==mine&&m[1]!==UNSTAMPED&&sessionStorage.getItem('reloaded')!==m[1]){ sessionStorage.setItem('reloaded',m[1]); location.reload(); } }).catch(()=>{}); }catch(e){} })();
new MutationObserver(renderNav).observe(document.getElementById('segView'),{attributes:true,subtree:true,attributeFilter:['style','aria-pressed']});
fetch('week_plan.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(w=>{
  if(w&&w.teams){ W=w; if(activeView()==='week') setView('week'); } else throw new Error('no plan');
}).catch(err=>{ const pn=document.getElementById('weekPane'); if(activeView()==='week') pn.innerHTML=`<div class="err" style="padding:1rem">Couldn't load this week's plan (${esc(String(err&&err.message||err))}). <button class="dbtn" id="weekRetry" type="button">Retry</button> <span class="hint">or open Players &gt; Board</span></div>`;
  const rb=document.getElementById('weekRetry'); if(rb) rb.addEventListener('click',()=>location.reload()); });
const LIVE_URL='https://raw.githubusercontent.com/pitchafwa/delegation-hub/live-data/live_matchup.json';
async function loadLive(){
  for(const u of [LIVE_URL+'?t='+Date.now(),'live_matchup.json?t='+Date.now()]){
    try{ const r=await fetch(u,{cache:'no-store'}); if(!r.ok) continue; const j=await r.json(); if(j&&j.matchup){ const changed=!LIVE||LIVE.generated!==j.generated; LIVE=j; if(changed&&activeView()==='week'&&W) renderWeek(); return; } }catch(e){}
  }
}
loadLive(); setInterval(loadLive,120000);
fetch('playoff_odds.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(x=>{ if(x&&x.teams){ODDS=x; if(activeView()==='week') setView('week');} }).catch(()=>{});
fetch('redraft_data.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(x=>{ if(x&&x.players){RD=x; if(activeView()==='redraft') renderRedraft();} }).catch(()=>{});
fetch('schedule_plan.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(x=>{ if(x&&x.nba){SP=x; if(activeView()==='sched'||activeView()==='week') setView(activeView());} }).catch(()=>{});
fetch('hub_data.json',{cache:'no-cache'}).then(r=>r.json()).then(data=>{
  D=data;
  document.getElementById('hSub').innerHTML = (D.ctx_mode==='carry' ? '<b style="color:var(--warn)">VARIANT: for incoming rookies the team-situation boost applies to year 1 only, and that boosted year-1 level is the baseline for every later season (no fade).</b> ' : '') + D.note;
  document.getElementById('foot').textContent += ` Generated ${new Date(D.generated).toLocaleString()}.`;
  fetch('league_rosters.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(l=>{ if(l&&l.teams){L=l; initLeague(); render(); if(RD) RD._own=null; if(activeView()==='teams') setView('teams'); if(activeView()==='redraft') renderRedraft();} }).catch(()=>{});
  fetch('draft_data.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(d=>{ if(d&&d.draft){DR=d; if(activeView()==='draft') setView('draft'); if(activeView()==='keepers') setView('keepers'); pollDraftLive(); setInterval(pollDraftLive,5000);} }).catch(()=>{});
  fetch('team_profiles.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(p=>{ if(p&&p.teams){PROF=p;} }).catch(()=>{});
  fetch('trade_ideas.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(t=>{ if(t&&t.teams){TR=t; if(activeView()==='trades') setView('trades');} }).catch(()=>{});
  fetch('breakout_history.json',{cache:'no-cache'}).then(r=>r.json()).then(h=>{H=h; fillYearSelect(); render();}).catch(()=>{});
  render();
}).catch(err=>{
  document.getElementById('boardPane').innerHTML = `<div class="err">Couldn't load hub_data.json — ${err}</div>`;
});
</script>
