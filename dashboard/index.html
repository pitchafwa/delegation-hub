<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fantasy Hub</title>
<meta name="theme-color" content="#0f1318" />
<meta name="build" content="__BUILD__" />
<link rel="icon" href="favicon.ico" sizes="48x48 32x32 16x16" />
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<meta name="apple-mobile-web-app-title" content="Fantasy Hub" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<style>
  :root{--paper:#f3f5f7;--surface:#fff;--surface-2:#eef1f4;--ink:#171d24;--ink-soft:#55606c;
    --ink-faint:#8a939d;--line:#dde2e8;--line-strong:#c6cdd5;--accent:#a9741f;
    --good:#2f7d5d;--warn:#b1472f;--intl:#7a5cc8;--current:#3a86c8}
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --paper:#0f1318;--surface:#171d24;--surface-2:#1e252d;--ink:#e2e6ea;--ink-soft:#97a2ad;
    --ink-faint:#6c7680;--line:#2a323b;--line-strong:#39434e;--accent:#d69a3f;
    --good:#4ea883;--warn:#d3694c;--intl:#9c85e0;--current:#5aa0dd}}
  :root[data-theme="dark"]{--paper:#0f1318;--surface:#171d24;--surface-2:#1e252d;--ink:#e2e6ea;--ink-soft:#97a2ad;
    --ink-faint:#6c7680;--line:#2a323b;--line-strong:#39434e;--accent:#d69a3f;
    --good:#4ea883;--warn:#d3694c;--intl:#9c85e0;--current:#5aa0dd}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1280px;margin:0 auto;padding:2rem clamp(.7rem,3vw,2rem) 4rem}
  h1{font-family:"Zilla Slab",Georgia,serif;font-weight:700;font-size:clamp(1.7rem,4vw,2.4rem);margin:0 0 .15rem}
  .sub{color:var(--ink-soft);font-size:.92rem;margin-bottom:1.3rem;max-width:70ch}
  a{color:var(--accent)}
  .statbar{display:flex;flex-wrap:wrap;gap:1.1rem 1.9rem;padding:1rem 1.2rem;background:var(--surface);
    border:1px solid var(--line);border-radius:10px;margin-bottom:1.1rem;font-family:"IBM Plex Mono",monospace;font-size:.74rem;color:var(--ink-soft)}
  .statbar b{display:block;font:600 1.1rem/1 "IBM Plex Sans",sans-serif;color:var(--ink);letter-spacing:-.01em}

  .controls{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:.6rem;align-items:center}
  .seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
  .seg button{border:0;background:var(--surface);color:var(--ink-soft);padding:.42rem .72rem;font:inherit;font-size:.8rem;cursor:pointer}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
  .hint{font-size:.72rem;color:var(--ink-faint);font-family:"IBM Plex Mono",monospace}
  input[type=search]{flex:1;min-width:150px;padding:.42rem .7rem;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:.84rem}
  .kbox{display:flex;align-items:center;gap:.5rem;padding:.3rem .7rem;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;font-size:.8rem}
  .kbox input[type=range]{width:110px}
  .kbox input[type=number]{width:3.2rem;color:var(--accent);font-family:"IBM Plex Mono",monospace;font-weight:600;text-align:center;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:6px;padding:.15rem .2rem}
  .legend{font-size:.78rem;color:var(--ink-faint);margin:.2rem 0 1rem;line-height:1.65}
  .legend b{color:var(--ink-soft)} .legend .intl{color:var(--intl)} .legend .cur{color:var(--current)}

  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
  table{border-collapse:collapse;width:100%;font-size:.8rem}
  th,td{padding:.45rem .36rem;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
  /* identity block (Player/Pos/Team/Age) sits tight together; value columns get their normal spacing */
  #boardPane tbody tr:not(.detail) td:first-child{white-space:normal;max-width:165px}
  #boardPane tbody tr:not(.detail) td:nth-child(2){white-space:normal;max-width:56px;line-height:1.2}
  #boardPane tbody tr:not(.detail) td:nth-child(3){white-space:normal;max-width:84px}
  th:nth-child(2),td:nth-child(2){padding-left:.25rem}
  th:nth-child(3),td:nth-child(3){padding-left:.25rem}
  th:nth-child(4),td:nth-child(4){padding-left:.25rem;padding-right:1.1rem;border-right:1px solid var(--line)}
  th:first-child,td:first-child,th:nth-child(2),td:nth-child(2),th:nth-child(3),td:nth-child(3){text-align:left}
  thead th{position:sticky;top:0;background:var(--surface-2);border-top:0;font-family:"IBM Plex Mono",monospace;
    font-size:.64rem;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-soft);font-weight:500;cursor:pointer;user-select:none;white-space:normal;vertical-align:bottom;line-height:1.25}
  thead th.sorted::after{content:" ▾";color:var(--accent)}
  thead th.sorted.asc::after{content:" ▴"}
  tbody tr{cursor:pointer} tbody tr:hover{background:var(--surface-2)}
  td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
  .kind{display:inline-block;min-width:1.4rem;text-align:center;font-family:"IBM Plex Mono",monospace;font-weight:600;padding:.05rem .28rem;border-radius:4px;font-size:.68rem}
  .kind.rookie{background:color-mix(in srgb, var(--intl) 18%, transparent);color:var(--intl);letter-spacing:.03em}
  .spark{display:block;vertical-align:middle}
  .sparkCell{display:flex;align-items:center;gap:.4rem;justify-content:flex-end}
  .sparkDelta{font-family:"IBM Plex Mono",monospace;font-size:.7rem;min-width:2.2rem;text-align:right}
  .sparkDelta.up{color:var(--good)} .sparkDelta.down{color:var(--warn)} .sparkDelta.flat{color:var(--ink-faint)}
  .teamCell{display:flex;align-items:center;gap:.35rem;justify-content:flex-start}
  .teamCell img{width:18px;height:18px;object-fit:contain}
  .injDot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:.35rem}
  .injDot.watch{background:var(--accent)} .injDot.chronic{background:var(--warn)}
  .injDot.t0{background:var(--good)} .injDot.t1{background:color-mix(in srgb,var(--good) 55%,transparent)} .injDot.t3{background:var(--accent)} .injDot.t4{background:var(--warn)}
  .injTier{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:.62rem;font-weight:600;padding:.05rem .35rem;border-radius:4px;margin-right:.35rem;background:color-mix(in srgb,var(--ink-faint) 22%,transparent)}
  .injTier.t0,.injTier.t1{background:color-mix(in srgb,var(--good) 22%,transparent);color:var(--good)} .injTier.t3{background:color-mix(in srgb,var(--accent) 25%,transparent);color:var(--accent)} .injTier.t4{background:color-mix(in srgb,var(--warn) 25%,transparent);color:var(--warn)}
  .liveStatus{font-family:"IBM Plex Mono",monospace;font-size:.62rem;font-weight:600;padding:.04rem .32rem;border-radius:4px;margin-left:.35rem;background:color-mix(in srgb, var(--warn) 20%, transparent);color:var(--warn)}
  .ic{margin-left:.25rem;font-size:.82rem}
  .detail td{background:var(--surface-2);border-top:0;white-space:normal}
  .detailGrid{display:grid;grid-template-columns:var(--lc,340px) 1fr;gap:1.4rem;align-items:stretch;padding:.4rem 0}
  .detailGrid .dr{display:flex;align-items:center}
  .detailGrid .simwrap:first-child{margin-top:0}
  .statline.g4{grid-template-columns:repeat(4,1fr);margin-top:0}
  .inputs.g3{display:grid;grid-template-columns:repeat(3,1fr);margin-top:0}
  .comps.g2{display:grid;grid-template-columns:1fr 1fr;padding:0;gap:.3rem}
  .comps.g2 .comp{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.68rem;padding:.18rem .4rem}
  .detailGrid .inputs .i{font-size:.68rem;padding:.18rem .4rem}
  .detailGrid .simwrap{margin-top:.6rem}
  .detailGrid .statline .s{padding:.3rem .4rem}
  .teambox{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:.5rem .65rem;font-size:.76rem;line-height:1.5;white-space:normal}
  .teambox .note{margin-top:.3rem;font-size:.68rem}
  .trajChart{width:100%;height:auto;display:block}
  .tg{display:inline-block;min-width:1.15em;text-align:center;font-size:.7rem;line-height:1.25;padding:0 .28em;border-radius:5px;background:color-mix(in srgb,var(--tc,#888) 18%,transparent);color:var(--tc,#888);border:1px solid color-mix(in srgb,var(--tc,#888) 45%,transparent);font-weight:700;vertical-align:1px}
  .tg.tgNote{--tc:#8b93a0}
  .tgEd{margin:.4rem 0 .2rem}
  .tgOpts{display:flex;flex-wrap:wrap;gap:.35rem}
  .tgOpt{display:inline-flex;align-items:center;gap:.3rem;font-size:.78rem;padding:.2rem .5rem;border:1px solid var(--line-strong);border-radius:999px;cursor:pointer;color:var(--ink-soft);background:var(--surface)}
  .tgOpt.on{border-color:var(--tc);color:var(--ink);background:color-mix(in srgb,var(--tc) 12%,var(--surface))}
  .tgOpt input{margin:0}
  .tgNoteIn{width:100%;margin-top:.4rem;font:inherit;font-size:.82rem;padding:.4rem .5rem;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical}
  .tgMgr{padding:.3rem 0 .6rem}
  .tgList{display:flex;flex-wrap:wrap;gap:.4rem .9rem;font-size:.8rem}
  .tgRow{display:inline-flex;align-items:center;gap:.3rem}
  .tgDel{border:0;background:transparent;color:var(--ink-faint);cursor:pointer;font-size:1rem;line-height:1;padding:0 .2rem}


  .sec{border:1px solid var(--line);border-radius:12px;margin:0 0 .8rem;background:var(--surface)}
  .sec>summary{cursor:pointer;padding:.6rem .85rem;display:flex;gap:.2rem .7rem;align-items:baseline;flex-wrap:wrap;list-style:none}
  .sec>summary::-webkit-details-marker{display:none}
  .sec>summary::before{content:'▸';color:var(--ink-faint);font-size:.8rem;transition:transform .12s}
  .sec[open]>summary::before{transform:rotate(90deg)}
  .secT{font-family:"IBM Plex Mono",monospace;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);font-weight:600}
  .secM{font-size:.76rem;color:var(--ink-faint)}
  .secB{padding:0 .85rem .7rem}
  .secB>.tablewrap{border-radius:8px}
  .jumpBar{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center;margin:0 0 .9rem;position:sticky;top:0;z-index:5;background:var(--paper);padding:.4rem 0}
  .jumpBar button{font:inherit;font-size:.74rem;padding:.22rem .6rem;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);color:var(--ink-soft);cursor:pointer}
  .jumpBar button:hover{color:var(--ink);border-color:var(--ink-faint)}
  .laterBox{border:1px solid var(--line);border-left:3px solid var(--accent,#5b7cfa);border-radius:8px;padding:.5rem .7rem;margin:0 0 .8rem;background:var(--surface-2,transparent)}
  .laterHd{font-weight:600;font-size:.82rem;margin-bottom:.25rem}
  .lt{display:grid;grid-template-columns:3.6rem 1fr;gap:.5rem;padding:.15rem 0;font-size:.85rem}
  .ltD{font-family:"IBM Plex Mono",monospace;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent,#5b7cfa);padding-top:.12rem}

  #redraftPane .tablewrap tbody tr:not(.detail) td:first-child{white-space:normal;max-width:190px}
  #redraftPane .sparkCell{justify-content:flex-start}
  #redraftPane .controls input[type=search]{min-width:170px}
  @media(max-width:760px){
    #redraftPane .tablewrap{border:0;background:transparent;overflow:visible}
    #redraftPane table,#redraftPane tbody,#redraftPane tr,#redraftPane td{display:block;width:100%}
    #redraftPane thead{display:none}
    #redraftPane tbody tr:not(.detail){display:grid;grid-template-columns:repeat(4,1fr);gap:.1rem .5rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.6rem .7rem;margin:.55rem 0}
    #redraftPane tbody tr.detail{border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;margin:-.55rem 0 .55rem;padding:.6rem .5rem;background:var(--surface)}
    #redraftPane tbody tr:not(.detail) td{border:0 !important;text-align:left !important;padding:.1rem 0 !important;display:block;min-width:0}
    #redraftPane td::before{content:attr(data-label);display:block;font-family:"IBM Plex Mono",monospace;font-size:.56rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint)}
    #redraftPane td:first-child{grid-column:1/-1;font-family:"Zilla Slab",serif;font-size:1.12rem;font-weight:500}
    #redraftPane td:first-child::before{content:none}
    #redraftPane td[data-label="Pos"],#redraftPane td[data-label="Team"],#redraftPane td[data-label="Age"],#redraftPane td[data-label="Rank"]{font-size:.8rem;color:var(--ink-soft)}
    #redraftPane td[data-label="Pos"]::before,#redraftPane td[data-label="Team"]::before,#redraftPane td[data-label="Age"]::before,#redraftPane td[data-label="Rank"]::before{display:none}
    #redraftPane td[data-label="Trajectory"]{grid-column:1/-1;padding-top:.25rem !important;order:20}
    #redraftPane td[data-label="Owner"]{order:12}
    #redraftPane .detail td{display:block !important}#redraftPane .detail td::before{content:none}
    #redraftPane .moreRow{display:block;background:transparent;border:0;padding:0}
    #redraftPane .moreRow td{display:block !important}#redraftPane .moreRow td::before{content:none}
    #redraftPane .statbar{display:none}
  }

  .statline{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:.5rem;margin-top:.6rem}
  .statline .s{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.4rem .5rem;text-align:center}
  .statline .s .v{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:1rem}
  .statline .s .l{font-size:.62rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em}
  .inputs{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.6rem}
  .inputs .i{white-space:normal;font-family:"IBM Plex Mono",monospace;font-size:.73rem;padding:.2rem .5rem;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
  .inputs .i b{color:var(--accent)}
  .comps{display:flex;flex-wrap:wrap;gap:.4rem;padding:.3rem 0}
  .comp{white-space:normal;font-family:"IBM Plex Mono",monospace;font-size:.73rem;padding:.2rem .5rem;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
  .comp b{color:var(--accent)}
  .note{font-size:.77rem;color:var(--ink-faint);margin-top:.25rem}
  .simwrap{margin-top:.9rem}
  .simwrap .lbl{font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:.35rem}
  footer{margin-top:2.6rem;padding-top:1.1rem;border-top:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:.74rem;color:var(--ink-faint);line-height:1.7}
  .err{padding:2rem;text-align:center;color:var(--warn);font-family:"IBM Plex Mono",monospace}
  #aboutPane h2{font-family:"Zilla Slab",serif;font-size:1.25rem;margin:1.6rem 0 .5rem}
  #aboutPane h2:first-child{margin-top:0}
  #aboutPane p,#aboutPane li{color:var(--ink-soft);font-size:.92rem}
  #aboutPane .warn-box{border:1px solid var(--warn);border-radius:8px;padding:.8rem 1rem;background:color-mix(in srgb, var(--warn) 8%, transparent);margin:.8rem 0}

  .mobileOnly{display:none}
  .cardPair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem;align-items:start;margin-bottom:1rem}.cardPair:empty{display:none;margin:0}
.cardPair>details{margin:0}
@media(max-width:820px){.cardPair{grid-template-columns:1fr}}
.frm{font-size:.72rem;line-height:1.25;margin-top:.15rem;white-space:normal}.frm.hot b:first-child{color:var(--good)}.frm.cold b:first-child{color:var(--warn)}.frm i{font-style:normal;opacity:.7}
.gwDay{margin:.45rem 0 .15rem;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.gwRow{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:.6rem;padding:.2rem 0;border-top:1px solid var(--line);font-size:.82rem}
.gwP{display:flex;flex-wrap:wrap;gap:.2rem .9rem}.gwMe{color:var(--good)}.gwOp{color:var(--warn)}
.gwMeK{color:var(--good);font-weight:600}.gwOpK{color:var(--warn);font-weight:600}
@media(max-width:600px){.gwRow{grid-template-columns:1fr}}
.liveCard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.8rem .95rem;margin-bottom:1rem}
  .liveHd{font-family:"IBM Plex Mono",monospace;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;display:flex;gap:.5rem;align-items:center;margin-bottom:.5rem}
  .liveDot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
  .liveScore{display:grid;grid-template-columns:1fr auto 1fr;gap:.6rem;align-items:center}
  .liveScore>div{display:flex;flex-direction:column}.liveScore b{font-size:1.55rem;font-family:"IBM Plex Mono",monospace}
  .liveWp{align-items:center;text-align:center}.liveWp b{font-size:1.7rem}
  .liveRow{font-size:.8rem;margin-top:.35rem}.liveAdv{font-size:.88rem;margin-top:.35rem;padding:.35rem .5rem;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
  .liveMore{margin-top:.4rem}
  .kSel td{background:color-mix(in srgb,var(--accent) 13%,transparent)}
  .kSens,.kDraft>div{padding:.22rem 0;font-size:.86rem}
  .kTbl th.cbh,.kTbl td.cbc{width:1.8rem;text-align:center}
  .dgs{display:flex;flex-wrap:wrap;gap:.15rem .6rem;font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--ink-soft)}.dgs .best{color:var(--good);font-weight:700}
  /* NBA games-per-week grid: same table look as everywhere else (global th/td/thead styles), with the column quirks of the other tables switched off */
  table.heat th,table.heat td{padding:.32rem .3rem;text-align:center;border-right:0}
  table.heat th:nth-child(n),table.heat td:nth-child(n){padding-left:.3rem;padding-right:.3rem;border-right:0}
  table.heat th:first-child,table.heat td:first-child{text-align:left;padding-left:.6rem;padding-right:.6rem;position:sticky;left:0;z-index:1;background:var(--surface)}
  table.heat thead th:first-child{background:var(--surface-2);z-index:2}
  table.heat th.po{color:var(--accent)}
  table.heat td.mine:first-child{color:var(--accent);font-weight:700}
  table.heat td.cur,table.heat th.cur{box-shadow:inset 0 0 0 2px var(--ink-soft)}
  .tablewrap.heatWrap{overflow-x:auto !important;max-height:70vh;border:1px solid var(--line) !important;background:var(--surface) !important;border-radius:12px}
  .addTime td.best{background:color-mix(in srgb,var(--good) 22%,transparent);font-weight:600}
  #draftTbl th.cbh,#draftTbl td.cbc{width:1.6rem;min-width:0;padding-left:.25rem;padding-right:.25rem;text-align:center}
  #draftTbl tr.goneRow td{opacity:.42;cursor:default}
  #draftTbl tr.goneRow td.cbc{opacity:.8}
  .profCard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.8rem .95rem;margin:.6rem 0 1rem}
  .profHd{font-weight:600;margin-bottom:.2rem}
  .profTbl{border-collapse:collapse;width:100%;font-size:.82rem;margin-top:.3rem}.profTbl th,.profTbl td{padding:.22rem .3rem;border-top:1px solid var(--line);white-space:normal}
  .profYr{font-size:.8rem;padding:.35rem 0;border-top:1px solid var(--line)}
  .dStrip{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;padding:.8rem 1rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:.4rem 0 1rem;font-family:"IBM Plex Mono",monospace;font-size:.7rem;color:var(--ink-soft)}
  .dStrip b{display:block;font:600 1.1rem/1.1 "IBM Plex Sans",sans-serif;color:var(--ink)}
  .dTop{display:grid;grid-template-columns:1fr 300px;gap:1.2rem;align-items:start}
  .dSide{position:sticky;top:.6rem}
  .dTeam{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.7rem .85rem}
  .dHd{font-weight:600;margin-bottom:.4rem;cursor:pointer}
  #dpos,#dSortSel{padding:.42rem .5rem;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:.85rem}
  .dSlot{display:flex;gap:.5rem;padding:.22rem 0;border-top:1px solid var(--line);font-size:.84rem}.dSlot b{min-width:2rem;font-family:"IBM Plex Mono",monospace;color:var(--accent)}
  .dSub{font-size:.76rem;color:var(--ink-soft);margin-top:.5rem}
  .dbtn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;padding:.4rem .7rem;font:inherit;font-size:.8rem;cursor:pointer;min-height:38px}
  #draftTbl th{white-space:normal}#draftTbl td{padding:.4rem .4rem}
  @media(max-width:900px){.dTop{grid-template-columns:1fr}.dSide{position:static;order:-1}}
  .tradeCard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.7rem .9rem;margin-bottom:.7rem}
  .tradeHd{display:flex;align-items:baseline;gap:.4rem;padding-bottom:.35rem;border-bottom:1px solid var(--line);margin-bottom:.35rem}
  .tradeScore{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--good);font-size:1.05rem}
  .tradeRow{padding:.12rem 0;font-size:.92rem}.tradeRow.small{font-size:.8rem;color:var(--ink-soft)}
  .tradeRow .lbl{display:inline-block;min-width:4.3rem;font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint)}
  .tradeCtl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.8rem;margin:.2rem 0 .9rem}
  .tradeCtl label{font-size:.78rem;color:var(--ink-soft);display:block}.tradeCtl input{width:100%}
  @media(max-width:720px){.tradeCtl{grid-template-columns:1fr}}
  .irBox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;margin-bottom:1.2rem}
  .irRow{padding:.35rem 0;border-top:1px solid var(--line);font-size:.86rem}.irRow:first-child{border-top:0}
  .moreRow td{padding:0 !important;border:0 !important}
  #moreBtn{width:100%;min-height:48px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
  .comp .nm{white-space:nowrap}
  /* ================= MOBILE (phones) ================= */
  @media(max-width:720px){
    body{font-size:15px}
    .wrap{padding:.8rem .65rem 6.2rem}
    h1{font-size:1.35rem;margin-bottom:.5rem}
    .sub{display:none}
    /* bottom tab bar: thumb reach */
    #navTop{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;border:0;border-top:1px solid var(--line-strong);border-radius:0;
      background:var(--surface);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -6px 18px rgba(0,0,0,.18)}
    #navTop button{flex:1;min-height:56px;padding:.35rem .2rem;font-size:.82rem;border:0;background:transparent;color:var(--ink-soft);border-left:1px solid var(--line)}
    #navTop button:first-child{border-left:0}
    #navTop button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
    .controls:has(#navTop){margin-bottom:0 !important}
    #navSub{display:flex;width:100%}#navSub button{flex:1;padding:.55rem .4rem;font-size:.86rem}
    /* controls */
    .controls{gap:.5rem}
    .controls .hint{order:9;flex-basis:100%}
    input[type=search],select{font-size:16px !important;min-height:44px}
    input[type=search]{min-width:0;flex-basis:100%;order:1}
    #segKind{display:flex;flex-wrap:nowrap;overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    #segKind::-webkit-scrollbar{display:none}
    #segKind button{white-space:nowrap;min-height:44px;flex:0 0 auto}
    #segBrk{display:flex;flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:none}
    #segBrk button{white-space:nowrap;min-height:40px;flex:0 0 auto}
    #segKind .hint,#segBrk .hint{display:none}
    #ownerSel{flex:1;min-width:0}
    .kbox{width:100%;padding:.55rem .8rem}
    .kbox input[type=range]{flex:1;width:auto;min-height:32px}
    .kbox input[type=number]{width:3.6rem;font-size:16px}
    .seg{flex-wrap:wrap}
    /* summary bars */
    .statbar{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem .6rem;font-size:.62rem;padding:.7rem .75rem}
    .statbar b{font-size:1.05rem}
    #weekPane .statbar{grid-template-columns:repeat(2,1fr)}
    #weekPane .statbar>div:first-child,#weekPane .statbar>div:nth-child(5){grid-column:span 1}
    .legend{font-size:.74rem}
    .legend details>summary,.legend>details>summary{cursor:pointer;color:var(--ink-soft);font-weight:600;padding:.4rem 0}

    /* ---- generic card tables (JS adds .mcards + data-labels to tables in the Week and Teams panes) ---- */
    .tablewrap{border:0;background:transparent;overflow:visible}
    table.mcards,table.mcards tbody,table.mcards tr,table.mcards td{display:block;width:100%}
    table.mcards thead{display:none}
    table.mcards tbody tr{display:grid;grid-template-columns:repeat(4,1fr);gap:.15rem .5rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;
      margin-bottom:.55rem;padding:.6rem .75rem;text-align:left}
    table.mcards td{border:0 !important;padding:.1rem 0 !important;text-align:left !important;white-space:normal !important;font-size:.9rem;display:block;min-width:0}
    table.mcards td::before{content:attr(data-label);display:block;font-family:"IBM Plex Mono",monospace;font-size:.56rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint)}
    table.mcards td:first-child{grid-column:1/-1;font-family:"Zilla Slab",serif;font-size:1.05rem;font-weight:500;padding-bottom:.3rem !important;border-bottom:1px solid var(--line) !important;margin-bottom:.2rem}
    table.mcards td:first-child::before{display:none}
    table.mcards td[data-label="Games"]{grid-column:1/-1}
    /* Week: day plan */
    .dStrip{grid-template-columns:repeat(2,1fr)}
    table.draftTbl td[data-label="Team"],table.draftTbl td[data-label="Pos"],table.draftTbl td[data-label="Age"]{font-size:.8rem;color:var(--ink-soft)}
    table.draftTbl td[data-label="Team"]::before,table.draftTbl td[data-label="Pos"]::before,table.draftTbl td[data-label="Age"]::before{display:none}
    table.draftTbl td[data-label="Score"]{order:4}table.draftTbl td[data-label="Lineup fit"]{order:5}table.draftTbl td[data-label="Dynasty fit"]{order:6}table.draftTbl td[data-label="ADP"]{order:7}
    table.draftTbl td[data-label="Redraft rk"]{order:8}table.draftTbl td[data-label="VOR"]{order:9}table.draftTbl td[data-label="Asset"]{order:10}table.draftTbl td[data-label="MKT"]{order:11}
    table.draftTbl td[data-label="Our proj"]{order:12}table.draftTbl td[data-label="ESPN proj"]{order:13}
    table.draftTbl tr.detail,table.draftTbl tr.moreRow{display:block;grid-column:auto}
    table.draftTbl tbody tr.detail td{grid-column:1/-1;display:block}
    table.draftTbl tbody tr.detail{background:var(--surface-2)}
    table.dayTbl tbody tr{grid-template-columns:repeat(3,1fr)}
    table.dayTbl td[data-label="Day"]{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;font-family:"IBM Plex Sans",sans-serif;font-weight:600;font-size:.98rem}
    table.dayTbl td[data-label^="Starting"]{grid-column:1/-1;padding:.35rem 0 !important}
    table.dayTbl td[data-label^="Starting"]::before{display:none}
    table.dayTbl .comps{display:grid !important;grid-template-columns:1fr 1fr;gap:.3rem !important}
    table.dayTbl .comp{white-space:nowrap !important;overflow:hidden;text-overflow:ellipsis;font-size:.7rem;padding:.3rem .4rem;min-height:30px}
    /* Week: suggested moves (# / Add / Drop / Net gain / cumulative) */
    table.moveTbl tbody tr{grid-template-columns:1.7rem 1fr auto}
    table.moveTbl td[data-label="#"]{grid-column:1;grid-row:1;border:0 !important;font-family:"IBM Plex Mono",monospace;font-size:.85rem;color:var(--accent);font-weight:600}
    table.moveTbl td[data-label="#"]::before{display:none}
    table.moveTbl td[data-label="Add"]{grid-column:2;grid-row:1;font-family:"IBM Plex Sans",sans-serif;font-size:.95rem;border:0 !important;margin:0;padding:0 !important}
    table.moveTbl td[data-label="Add"]::before,table.moveTbl td[data-label="Net gain"]::before{display:none}
    table.moveTbl td[data-label="Net gain"]{grid-column:3;grid-row:1;text-align:right !important;font-size:1.05rem}
    table.moveTbl td[data-label="Drop"]{grid-column:2/4;grid-row:2}
    table.moveTbl td[data-label^="This week"]{grid-column:2/4;grid-row:3}
    table.moveTbl td[data-label^="Timing"]{grid-column:2/4;grid-row:4}
    /* Week: single adds */
    table.addTbl tbody tr{grid-template-columns:1fr 1fr auto}
    table.addTbl td[data-label="Add"]{grid-column:1/3;grid-row:1;font-family:"IBM Plex Sans",sans-serif;font-size:.95rem;border:0 !important;margin:0;padding:0 !important}
    table.addTbl td[data-label="Add"]::before,table.addTbl td[data-label="Gain"]::before{display:none}
    table.addTbl td[data-label="Gain"]{grid-column:3;grid-row:1;text-align:right !important;font-size:1.05rem}
    table.addTbl td[data-label="Level"]{grid-column:1;grid-row:2}
    table.addTbl td[data-label="Games"]{grid-column:2/4;grid-row:2}
    table.addTbl td[data-label="Drop"]{grid-column:1/-1;grid-row:3}
    /* Week: roster */
    table.rosterTbl td[data-label="Games"]{letter-spacing:.25em;font-family:"IBM Plex Mono",monospace}
    /* Teams: league table */
    table.leagueTbl tbody tr{grid-template-columns:repeat(3,1fr)}
    table.leagueTbl td[data-label="#"]{display:none}
    table.leagueTbl td[data-label="Team"]{grid-column:1/-1}
    table.leagueTbl td[data-label="Best asset"]{grid-column:1/-1}

    /* ---- Board: player cards as a compact metric grid ---- */
    #boardPane .tablewrap{border:0;background:transparent;overflow:visible}
    #boardPane table,#boardPane tbody,#boardPane tr,#boardPane td{display:block;width:100%}
    #boardPane thead{display:none}
    #boardPane tbody tr:not(.detail){display:grid;grid-template-columns:repeat(4,1fr);gap:.1rem .5rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:.55rem;padding:.6rem .75rem}
    #boardPane tbody tr:not(.detail):active{background:var(--surface-2)}
    #boardPane tbody tr.detail{border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;margin:-.55rem 0 .55rem;padding:.6rem .5rem;background:var(--surface-2)}
    #boardPane tbody tr:not(.detail) td{border:0 !important;text-align:left !important;padding:.1rem 0 !important;display:block;font-size:.95rem;min-width:0;white-space:normal}
    #boardPane td::before{content:attr(data-label);display:block;font-family:"IBM Plex Mono",monospace;font-size:.56rem;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);align-self:auto}
    #boardPane td:first-child{grid-column:1/-1;font-family:"Zilla Slab",serif;font-size:1.12rem;font-weight:500;padding-bottom:.15rem !important}
    #boardPane td:first-child::before{content:none}
    #boardPane td[data-label="Pos"],#boardPane td[data-label="Team"],#boardPane td[data-label="Age"]{grid-column:span 1;font-size:.8rem;color:var(--ink-soft)}
    #boardPane td[data-label="Pos"]::before,#boardPane td[data-label="Team"]::before,#boardPane td[data-label="Age"]::before{display:none}
    #boardPane td[data-label="Team"]{grid-column:span 2}
    #boardPane td[data-label="Trajectory"]{grid-column:1/-1;padding-top:.25rem !important}
    #boardPane td[data-label="Trajectory"] .sparkCell{justify-content:flex-start}
    #boardPane td[data-label="Trajectory"] .spark{width:120px}
    #boardPane td[data-label="Why"]{grid-column:1/-1}
    #boardPane td[data-label="Type"]{grid-column:span 2}
    #boardPane td[data-label="Proj next"]{grid-column:span 2}
    #boardPane td.num b{font-size:1.02rem}
    /* card order: identity, then Asset | VOR | MKT | Owner, then 2026 | Peak | 90PCT VOR | 90PCT AST, then trajectory */
    #boardPane td[data-label="Pos"]{order:1}#boardPane td[data-label="Team"]{order:2}#boardPane td[data-label="Age"]{order:3}
    #boardPane td[data-label="Asset"]{order:4}#boardPane td[data-label="VOR"]{order:5}#boardPane td[data-label="MKT"]{order:6}#boardPane td[data-label="Owner"]{order:7}
    #boardPane td[data-label="Yr-1 PPG"]{order:8}#boardPane td[data-label="Peak PPG"]{order:9}#boardPane td[data-label="90PCT VOR"]{order:10}#boardPane td[data-label="90PCT AST"]{order:11}
    #boardPane td[data-label="Trajectory"]{order:12}
    #boardPane td[data-label="Asset"] b,#boardPane td[data-label="VOR"] b{font-size:1.2rem}
    #boardPane .moreRow{display:block;background:transparent;border:0;padding:0;margin:.2rem 0 1rem}
    #boardPane .moreRow td{display:block !important}#boardPane .moreRow td::before{content:none}
    .mobileOnly{display:flex;gap:.4rem}
    #sortSel{flex:1;min-width:0;padding:.4rem .6rem;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
    #sortDir{min-width:48px;min-height:44px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font-size:1.1rem}
    table.dayTbl .comp{display:flex !important;gap:.3rem;align-items:baseline}
    table.dayTbl .comp .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
    table.moveTbl td[data-label^="This week"]{display:flex !important;gap:.5rem;align-items:baseline;font-size:.78rem;color:var(--ink-soft)}
    table.moveTbl td[data-label^="This week"]::before{content:"running total";display:inline}
    table.rosterTbl td[data-label="Games"]{padding-top:.25rem !important}
    /* compact control stack on phones: search, then filter + sort side by side, then keepers */
    #boardPane .statbar{display:none}
    input[type=search]{order:1}
    #ownerSel{order:2;flex:1 1 42%;min-width:0}
    #sortBox.mobileOnly{order:3;flex:1 1 52%}
    .kbox{order:4}
    #boardPane .controls .kbox{margin-top:0}
    /* Teams pane: keepers, team picker, roster, then the league ranking */
    #teamsPane{display:flex;flex-direction:column}
    #teamsPane>.controls{order:1}
    #teamsPane>.teamPick{order:2;margin:.2rem 0 .6rem}
    #teamsPane>.teamPick select{width:100%;padding:.5rem .7rem;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
    #teamsPane>.rosterProfile{order:3}
    #teamsPane>.rosterHdr{order:3}
    #teamsPane>.rosterWrap{order:4}
    #teamsPane>.leagueHdr{order:5;font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin:1.2rem 0 .5rem}
    #teamsPane>.leagueWrap{order:6}
    #teamsPane>.legend{order:7}
    table.leagueTbl td[data-label="Team"]{font-family:"Zilla Slab",serif;font-size:1.05rem;font-weight:500}
    table.leagueTbl td[data-label="Team"]::before{display:none}
    table.leagueTbl tbody tr{cursor:pointer}
    #boardPane .detail td{display:block !important}#boardPane .detail td::before{content:none}
    /* detail panel: chart first, everything stacked */
    .detailGrid{grid-template-columns:1fr !important;gap:.7rem}
    .detailGrid .dr{order:-1}
    .statline.g4{grid-template-columns:repeat(4,1fr)}
    .inputs.g3{grid-template-columns:repeat(2,1fr)}
    .comps.g2{grid-template-columns:1fr 1fr}
    .teambox{font-size:.8rem}
    #aboutPane p,#aboutPane li{font-size:.92rem}
    footer{margin-top:1.4rem;font-size:.66rem}
  }
  @media(max-width:720px){
    .sec{border-radius:10px;margin-bottom:.6rem}
    .sec>summary{padding:.5rem .65rem}
    .secB{padding:0 .4rem .5rem}
    .secM{flex-basis:100%;font-size:.72rem}
    .jumpBar{flex-wrap:nowrap;overflow-x:auto;gap:.3rem;padding:.35rem 0;margin-left:-.1rem;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .jumpBar::-webkit-scrollbar{display:none}
    .jumpBar>*{flex:0 0 auto}
    .jumpBar button{font-size:.72rem;padding:.2rem .55rem;white-space:nowrap}
    .cardPair{gap:.5rem}
    .laterBox{padding:.45rem .55rem}
    .lt{grid-template-columns:2.8rem 1fr;font-size:.82rem}
    /* long-term adds: name + priority on top, then age/asset/keeper, then mkt/bkt/level, then the long Fit text across the full width */
    table.ltTbl tbody tr{grid-template-columns:1fr 1fr 1fr;gap:.2rem .6rem}
    table.ltTbl td{grid-column:auto}
    table.ltTbl td[data-label="Priority"]{grid-column:3;grid-row:1;text-align:right !important;font-family:"IBM Plex Mono",monospace;font-size:1.25rem;font-weight:600;border:0 !important;margin:0;padding:0 !important}
    table.ltTbl td[data-label="Priority"]::before{display:none}
    table.ltTbl td[data-label="Priority"] .hint{font-size:.62rem;font-weight:400;white-space:nowrap}
    table.ltTbl td[data-label="Player"]{grid-column:1/3;grid-row:1;font-family:"IBM Plex Sans",sans-serif;font-size:1rem;border:0 !important;margin:0;padding:0 !important}
    table.ltTbl td[data-label="Player"]::before{display:none}
    table.ltTbl td[data-label="Age"],table.ltTbl td[data-label="Asset"],table.ltTbl td[data-label="Keeper rk"]{grid-row:2;padding-top:.35rem !important;border-top:1px solid var(--line) !important}
    table.ltTbl td[data-label="Age"]{grid-column:1}table.ltTbl td[data-label="Asset"]{grid-column:2}table.ltTbl td[data-label="Keeper rk"]{grid-column:3}
    table.ltTbl td[data-label="MKT"]{grid-column:1;grid-row:3}table.ltTbl td[data-label="BKT"]{grid-column:2;grid-row:3}table.ltTbl td[data-label="Level"]{grid-column:3;grid-row:3}
    table.ltTbl td[data-label="Fit"]{grid-column:1/-1;grid-row:4;padding-top:.4rem !important;margin-top:.15rem;border-top:1px solid var(--line) !important;font-size:.86rem;line-height:1.45}
    table.ltTbl td[data-label="Fit"]::before{margin-bottom:.15rem}
    /* injured-player advisor: one column, so the long verdict text can breathe */
    table.injTbl tbody tr{grid-template-columns:1fr}
    table.injTbl td:first-child{grid-column:1}
    table.injTbl td[data-label="Verdict"]{border-top:1px solid var(--line) !important;padding-top:.35rem !important;margin-top:.15rem}
    table.rosterTbl td[data-label^="Form"]{grid-column:span 2}
    #weekPane .frm{font-size:.72rem}
    #weekPane .tablewrap{border-radius:8px}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Fantasy Hub</h1>
  <div class="sub" id="hSub"></div>

  <div class="controls" style="margin-bottom:.5rem"><div class="seg" id="navTop"></div></div>
  <div class="controls" id="navSubWrap" style="margin-bottom:1rem"><div class="seg" id="navSub"></div></div>
  <div class="controls" style="display:none">
    <div class="seg" id="segView" style="display:none !important">
      <button data-v="week" id="weekBtn" aria-pressed="true">This week</button>
      <button data-v="sched" id="schedBtn">Schedule</button>
      <button data-v="board">Board</button>
      <button data-v="redraft" id="redraftBtn">Redraft</button>
      <button data-v="teams" id="teamsBtn">Teams</button>
      <button data-v="trades" id="tradesBtn">Trades</button>
      <button data-v="keepers" id="keepersBtn">Keepers</button>
      <button data-v="draft" id="draftBtn">Draft</button>
      <button data-v="about">About</button>
    </div>
  </div>

  <div id="aboutPane" style="display:none"></div>
  <div id="teamsPane" style="display:none"></div>
  <div id="weekPane"><div class="hint" style="padding:1rem">Loading this week's plan…</div></div>
  <div id="schedPane" style="display:none"></div>
  <div id="tradesPane" style="display:none"></div>
  <div id="keepersPane" style="display:none"></div>
  <div id="draftPane" style="display:none"></div>
  <div id="redraftPane" style="display:none"></div>
  <div id="boardPane" style="display:none">
  <div class="statbar" id="statbar"></div>

  <div class="controls">
    <div class="seg" id="segKind">
      <button data-v="all" aria-pressed="true">All</button>
      <button data-v="current" style="color:var(--current)">Current players</button>
      <button data-v="prospect">Prospects <span class="hint">(not yet debuted)</span></button>
      <button data-v="breakout" style="color:var(--good)">Breakouts</button>
    </div>
  </div>
  <div class="controls" id="brkCtl" style="display:none">
    <div class="seg" id="segBrk">
      <button data-v="all" aria-pressed="true">All types</button>
      <button data-v="emergence">Emerging <span class="hint">(→ fantasy-relevant)</span></button>
      <button data-v="elevation">Elevating <span class="hint">(good → great)</span></button>
      <button data-v="rookie">Rookies <span class="hint">(incoming)</span></button>
      <button data-v="radar">Under the radar <span class="hint">(edge vs ADP)</span></button>
      <button data-v="bust">Bust risk <span class="hint">(sell-high)</span></button>
    </div>
    <label class="kbox" style="gap:.5rem"><span>Season:</span><select id="brkYear" style="background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:.3rem .5rem;font:inherit"></select></label>
  </div>
  <div class="controls">
    <input type="search" id="q" placeholder="filter by name…" />
    <select id="ownerSel" style="display:none;padding:.42rem .5rem;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:.8rem"></select>
    <div class="kbox"><span>Keepers/team:</span><input type="range" id="kSlider" min="0" max="19" value="5" step="1" /><input type="number" id="kNum" min="0" max="19" step="1" value="5" /></div>
    <div class="mobileOnly" id="sortBox"><select id="sortSel" aria-label="Sort by"></select><button id="sortDir" type="button" aria-label="Reverse sort order">↓</button></div>
  </div>

  <div class="tablewrap"><table id="tbl"><thead><tr id="hrow"></tr></thead><tbody id="body"></tbody></table></div>
  <div class="legend" style="margin:1rem 0 0" id="legend"></div>
  </div>
  <footer id="foot">Delegation League Fantasy Hub — current-roster + rookie/prospect valuation, unified on one trajectory/VOR scale.</footer>
</div>

<script>
let rowLimit=60, lastSig='', D=null, H=null, brkYear='live', kind='all', brkType='all', q='', K=5, PROF=null, DR=null, dq='', dpos='all', dsort={k:'score',asc:false}, weekAfter=false, LIVE=null, SP=null, schedTeam=null, schedSort='playoffs', dHide=true, dShowDrafted=false, dDynPicks=3, dWEarly=0.40, dWLate=0.08, dOpen=null, dLive=false, TR=null, tradeTeam=null, tradeW=0.10, tradeRatio=0.95, tradeS=null, W=null, weekTeam=null, L=null, ownerFilter='all', teamSel=null, sort={k:'asset',asc:false}, open=new Set();

function oppCost(k){ return D.opportunity_cost.floor + D.opportunity_cost.amp * Math.exp(-k/D.opportunity_cost.tau); }
function computeVOR(traj, k){
  const opp = oppCost(k);
  let total=0, years=0;
  for(const v of traj){ if(v < opp) break; total += v-opp; years++; }
  return {vor: Math.round(total*10)/10, years};
}
const fmt1=v=>v==null?'—':v.toFixed(1);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let OWNER=new Map();  // hub player id -> {abbrev,name,team,slot}
function initLeague(){
  OWNER=new Map();
  for(const t of L.teams) for(const r of t.roster) if(r.id) OWNER.set(r.id,{abbrev:t.abbrev,name:t.name,team:t.id,slot:r.slot});
  const sel=document.getElementById('ownerSel');
  sel.innerHTML='<option value="all">All players</option><option value="fa">Free agents</option><option value="rostered">Rostered</option>'+L.teams.map(t=>`<option value="t${t.id}">${esc(t.abbrev)} · ${esc(t.name)}</option>`).join('');
  sel.style.display=''; document.getElementById('teamsBtn').style.display=''; 
  sel.addEventListener('change',e=>{ownerFilter=e.target.value; render();});
}
const yearLabel=(anchorYear,k)=>`'${String(anchorYear+k).slice(-2)}`;

// 5-year change (not the full 7) -- year 6-7 is often just a slow decline
// off a peak already reached, so a 7-year delta understates how good the
// near/mid-term climb actually is. The line itself still shows all 7.
function trajDelta5yr(traj){
  const base = traj[0] || 1;
  const idx = Math.min(4, traj.length-1);
  return (traj[idx]-traj[0])/base;
}

// Normalized (% of year-1 value) so shape is comparable across players
// regardless of absolute magnitude, colored by net direction (rising =
// good, falling = warn) with the peak point marked -- a raw-value sparkline
// of these mostly-smooth curves looked nearly identical row to row.
function sparkline(traj, w=56, h=26){
  const base = traj[0] || 1;
  const rel = traj.map(v => v/base);
  const max=Math.max(...rel,1.02), min=Math.min(...rel,0.98);
  const span=Math.max(max-min,0.02);
  const pts=rel.map((v,i)=>[ (i/(rel.length-1)*w), (h-((v-min)/span)*h) ]);
  const peakIdx = traj.indexOf(Math.max(...traj));
  const netChange = trajDelta5yr(traj);
  const dir = netChange > 0.03 ? 'up' : netChange < -0.03 ? 'down' : 'flat';
  const color = dir==='up' ? 'var(--good)' : dir==='down' ? 'var(--warn)' : 'var(--ink-faint)';
  const line = pts.map(p=>p.join(',')).join(' ');
  const peakDot = `<circle cx="${pts[peakIdx][0].toFixed(1)}" cy="${pts[peakIdx][1].toFixed(1)}" r="2.2" fill="${color}"/>`;
  const svg = `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="1.8"/>${peakDot}
  </svg>`;
  const deltaTxt = (netChange>=0?'+':'') + (netChange*100).toFixed(0) + '%';
  return `<div class="sparkCell">${svg}<span class="sparkDelta ${dir}" title="5-year change">${deltaTxt}</span></div>`;
}

// Real trailing seasons + projected future on one continuous timeline, so
// an implausible-looking projection (e.g. a "future peak" for a player
// whose real recent seasons already show clear decline) is immediately
// visible against the real trend it's supposed to continue from.
function trajChart(traj, opp, anchorYear, histYears=[], histValues=[], ceil=null, w=460, h=160){
  const futYears = traj.map((_,i)=>anchorYear+i);
  const allYears = [...histYears, ...futYears];
  const allValues = [...histValues, ...traj];
  const n = allYears.length;
  const histCount = histYears.length;
  const max=Math.max(...allValues, opp, ...(ceil||[]))*1.08, min=0;
  const span=Math.max(max-min,1);
  const pad=26;
  const iw=w-pad*2, ih=h-pad*1.7;
  const x=i=>pad+(n<=1?0:(i/(n-1))*iw);
  const y=v=>pad*0.6+ih-((v-min)/span)*ih;
  const ptsFor=(from,to)=>allValues.slice(from,to+1).map((v,k)=>`${x(from+k).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const oppY=y(opp).toFixed(1);
  const histPts = histCount>0 ? ptsFor(0, histCount-1) : '';
  // future line starts at the last history point (or first future point if no history) for visual continuity
  const futStart = histCount>0 ? histCount-1 : 0;
  const futPts = ptsFor(futStart, n-1);
  let ceilLine='';
  if(ceil){
    const base=histCount, m=Math.min(ceil.length, traj.length);
    const pts=[...Array(m).keys()].map(k=>`${x(base+k).toFixed(1)},${y(ceil[k]).toFixed(1)}`).join(' ');
    ceilLine=`<polyline points="${pts}" fill="none" stroke="var(--good)" stroke-width="1.6" stroke-dasharray="4,3"/>`+
      `<text x="${x(base+m-1).toFixed(1)}" y="${(y(ceil[m-1])-5).toFixed(1)}" font-size="8.5" text-anchor="end" fill="var(--good)" font-family="IBM Plex Mono, monospace">90th pct career</text>`;
  }
  const dots = allValues.map((v,i)=>{
    const isHist = i < histCount;
    return `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.6" fill="${isHist?'var(--ink-faint)':'var(--accent)'}"/>` +
      `<text x="${x(i).toFixed(1)}" y="${(y(v)-7).toFixed(1)}" font-size="9.5" text-anchor="middle" fill="var(--ink-soft)" font-family="IBM Plex Mono, monospace">${v.toFixed(0)}</text>`;
  }).join('');
  const yrs = allYears.map((yr,i)=>`<text x="${x(i).toFixed(1)}" y="${h-4}" font-size="9" text-anchor="middle" fill="${i<histCount?'var(--ink-faint)':'var(--ink-soft)'}" font-family="IBM Plex Mono, monospace">'${String(yr).slice(-2)}</text>`).join('');
  const todayX = histCount>0 ? x(histCount-1).toFixed(1) : null;
  const todayLine = todayX!=null ? `<line x1="${todayX}" y1="${pad*0.4}" x2="${todayX}" y2="${h-pad*0.9}" stroke="var(--line-strong)" stroke-width="1" stroke-dasharray="2,2"/><text x="${todayX}" y="${pad*0.35}" font-size="8.5" text-anchor="middle" fill="var(--ink-faint)" font-family="IBM Plex Mono, monospace">today</text>` : '';
  return `<svg class="trajChart" viewBox="0 0 ${w} ${h}">
    <line x1="${pad}" y1="${oppY}" x2="${w-pad}" y2="${oppY}" stroke="var(--warn)" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="${w-pad}" y="${(+oppY-4)}" font-size="9" text-anchor="end" fill="var(--warn)" font-family="IBM Plex Mono, monospace">replacement (${opp.toFixed(1)})</text>
    ${histPts?`<polyline points="${histPts}" fill="none" stroke="var(--ink-faint)" stroke-width="1.8"/>`:''}
    ${ceilLine}
    <polyline points="${futPts}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    ${todayLine}
    ${dots}${yrs}
  </svg>`;
}

function rookieStatLine(proj){
  if(!proj) return '';
  const min=proj.MIN||0;
  const per=(k,mult=1)=>((proj[k]||0)*min*mult);
  const rows=[['PTS',per('PTS')],['REB',per('REB')],['AST',per('AST')],['STL',per('STL')],
    ['BLK',per('BLK')],['3PM',per('FG3M')],['TOV',per('TOV')],['MIN',min]];
  return `<div class="statline">${rows.map(([l,v])=>`<div class="s"><div class="v">${v.toFixed(1)}</div><div class="l">${l}</div></div>`).join('')}</div>`;
}

function compChips(list, withFant){
  if(!list||!list.length) return '<span class="hint">no comps available</span>';
  return `<div class="comps">${list.map(s=>`<div class="comp"><b>${s.p}</b> '${String(s.y).slice(-2)} · ${s.sim}%${withFant&&s.fant!=null?` · ${(s.fant*100).toFixed(0)}%ile`:''}${s.intl?' 🌐':''}</div>`).join('')}</div>`;
}

// rank of every player by keeper-count-aware asset value at the current K (1 = most valuable)
function assetRanks(){
  const arr = D.players.filter(p=>p.asset_k).map(p=>[p.id, p.asset_k[K]]).sort((a,b)=>b[1]-a[1]);
  return new Map(arr.map((x,i)=>[x[0], i+1]));
}
function rowsFiltered(){
  let r = D.players;
  if(kind==='breakout'){
    r = r.filter(p => p.p_break!=null);
    if(brkType==='emergence'||brkType==='elevation'||brkType==='rookie') r = r.filter(p=>p.brk_tier===brkType);
    else if(brkType==='radar') r = r.filter(p=>p.edge_fpg!=null && p.edge_fpg>=2);
    else if(brkType==='bust') r = r.filter(p=>p.p_bust!=null);
  }
  else if(kind!=='all') r = r.filter(p => p.kind===kind);
  if(q) r = r.filter(p => p.player.toLowerCase().includes(q.toLowerCase()));
  if(L && ownerFilter!=='all'){
    r = r.filter(p => { const o=OWNER.get(p.id);
      return ownerFilter==='fa' ? !o : ownerFilter==='rostered' ? !!o : (o && 't'+o.team===ownerFilter); });
  }
  const assetRank = assetRanks();
  r = r.map(p => ({...p, _owner: OWNER.get(p.id)||null, _asset: p.asset_k?p.asset_k[K]:null, _market: p.market_rank!=null?p.market_rank:null, _mgap: (p.market_rank!=null&&assetRank.get(p.id))?p.market_rank-assetRank.get(p.id):null, _ceilVor: p.ceil_path?computeVOR(p.ceil_path, K).vor:null, _ceilAsset: p.ceil_asset_k?p.ceil_asset_k[K]:null, _assetRank: assetRank.get(p.id), _vor: computeVOR(p.trajectory, K), _vorB: p.trajectory_brk?computeVOR(p.trajectory_brk, K):null, _trajDelta: trajDelta5yr(p.trajectory)}));
  r.sort((a,b)=>{
    let av,bv;
    if(sort.k==='vor'){av=a._vor.vor;bv=b._vor.vor;}
    else if(sort.k==='asset'){av=a._asset;bv=b._asset;}
    else if(sort.k==='owner'){av=a._owner?a._owner.abbrev:null;bv=b._owner?b._owner.abbrev:null;}
    else if(sort.k==='market'){av=a._market!=null?-a._market:null;bv=b._market!=null?-b._market:null;}
    else if(sort.k==='ceil_vor'){av=a._ceilVor;bv=b._ceilVor;}
    else if(sort.k==='ceil_asset'){av=a._ceilAsset;bv=b._ceilAsset;}
    else if(sort.k==='vor_brk'){av=a._vorB?a._vorB.vor:null;bv=b._vorB?b._vorB.vor:null;}
    else if(sort.k==='sparkline'){av=a._trajDelta;bv=b._trajDelta;}
    else if(sort.k==='player'){av=a.player;bv=b.player;}
    else {av=a[sort.k];bv=b[sort.k];}
    if(av==null) av=(sort.k==='adp'&&sort.asc)?Infinity:-Infinity; if(bv==null) bv=(sort.k==='adp'&&sort.asc)?Infinity:-Infinity;
    if(typeof av==='string') return sort.asc ? av.localeCompare(bv) : bv.localeCompare(av);
    return sort.asc ? av-bv : bv-av;
  });
  return r;
}

const seasonLbl=y=>`${y}-${String((y+1)%100).padStart(2,'0')}`;
function renderHist(){
  const yr=+brkYear;
  let r=(H[brkYear]||[]).slice();
  const all=r.slice();
  if(brkType==='emergence'||brkType==='elevation'||brkType==='rookie') r=r.filter(p=>p.brk_tier===brkType);
  else if(brkType==='radar') r=r.filter(p=>p.edge_fpg!=null && p.edge_fpg>=2);
  else if(brkType==='bust') r=r.filter(p=>p.p_bust!=null);
  if(q) r=r.filter(p=>p.player.toLowerCase().includes(q.toLowerCase()));
  r.sort((a,b)=>{
    let av=a[sort.k], bv=b[sort.k];
    if(av==null) av=(sort.k==='adp'&&sort.asc)?Infinity:-Infinity; if(bv==null) bv=(sort.k==='adp'&&sort.asc)?Infinity:-Infinity;
    if(typeof av==='string') return sort.asc?av.localeCompare(bv):bv.localeCompare(av);
    return sort.asc?av-bv:bv-av;
  });
  // how well did the model's own ranking do that year (all tiers pooled, valid outcomes only)
  const valid=all.filter(p=>p.hit!=null).sort((a,b)=>b.p_break-a.p_break);
  const hits=n=>valid.slice(0,n).reduce((s,p)=>s+p.hit,0);
  const totalHits=valid.reduce((s,p)=>s+p.hit,0);
  document.getElementById('statbar').innerHTML=`
    <div><b>${all.length}</b>candidates scored</div>
    <div><b>${totalHits}</b>actually broke out (${(totalHits/Math.max(valid.length,1)*100).toFixed(0)}% base)</div>
    <div><b>${hits(10)}/10</b>of model's top 10 broke out</div>
    <div><b>${hits(25)}/25</b>of model's top 25 broke out</div>
    <div><b>${r.length}</b>showing</div>`;
  document.getElementById('legend').innerHTML=`<b>Walk-forward backtest:</b> what the model would have said after the ${seasonLbl(yr)} season, fit <i>only on earlier seasons</i>, next to what really happened in ${seasonLbl(yr+1)}. <b>✓ broke out</b> = Emerging: got within 1 pt of the ${oppCost(3).toFixed(1)} pts/g line with a +6 jump; Rookie: rookie-year pts/g within 1 pt of the line; Elevating: +6 pts/g jump (30+ GP either way). <b>↓</b> = an already-good player who dropped 6+ pts/g (bust). <b>n/a</b> = fewer than 30 games or off a roster. Edge vs ADP shown only 2020-23 (ADP-listed players). Early seasons have less training data, so they're rougher.`;
  const cols=[{k:'player',t:'Player'},{k:'team',t:'Team',sortable:false},{k:'age',t:'Age'},{k:'fpg_last',t:`${seasonLbl(yr)} (pts/g)`},
    {k:'brk_tier',t:'Type'},{k:'p_break',t:'Breakout chance'},{k:'proj_fpg',t:'Proj next (10–90%)'},{k:'p_bust',t:'Bust risk'},
    {k:'edge_fpg',t:'Edge vs ADP'},
    {k:'fpg_next',t:`${seasonLbl(yr+1)} (pts/g)`},{k:'hit',t:'Result'}];
  document.getElementById('hrow').innerHTML=cols.map(c=>`<th data-k="${c.k}" class="${sort.k===c.k?'sorted '+(sort.asc?'asc':''):''}" ${c.sortable===false?'data-sortable="false"':''}>${c.t}</th>`).join('');
  const sg=v=>(v>=0?'+':'')+v.toFixed(1);
  const body=r.map(p=>{
    const teamCell=p.team?`<div class="teamCell">${p.team_logo?`<img src="${p.team_logo}" alt="" loading="lazy"/>`:''}${p.team}</div>`:'—';
    const res = p.hit==null ? `<span class="hint" title="fewer than 30 games or not on a roster">n/a</span>`
      : p.hit===1 ? `<b style="color:var(--good)">✓ ${p.d_next!=null?sg(p.d_next):'relevant'}</b>`
      : p.bust_hit===1 ? `<b style="color:var(--warn)">↓ ${sg(p.d_next)}</b>` : `<span class="hint">— ${p.d_next!=null?sg(p.d_next):'missed'}</span>`;
    return `<tr data-id="${p.id}">
      <td data-label="Player">${p.player}</td><td data-label="Team">${teamCell}</td>
      <td class="num" data-label="Age">${p.age!=null?p.age.toFixed(1):'—'}</td>
      <td class="num" data-label="Last season">${fmt1(p.fpg_last)}</td>
      <td data-label="Type"><span class="hint">${p.brk_tier==='elevation'?'good → great':p.brk_tier==='rookie'?'rookie (yr 1)':'→ relevant'}</span></td>
      <td class="num" data-label="Breakout chance"><b>${(p.p_break*100).toFixed(0)}%</b></td>
      <td class="num" data-label="Proj next">${p.proj_fpg!=null?`<b>${p.proj_fpg.toFixed(0)}</b> <span class="hint">${p.proj_lo.toFixed(0)}–${p.proj_hi.toFixed(0)}</span>`:'—'}</td>
      <td class="num" data-label="Bust risk">${p.p_bust!=null?`<span style="color:${p.p_bust>=0.5?'var(--warn)':'inherit'}">${(p.p_bust*100).toFixed(0)}%</span>`:'<span class="hint">—</span>'}</td>
      <td class="num" data-label="Edge vs ADP">${p.edge_fpg!=null?`<b style="color:${p.edge_fpg>=2?'var(--good)':p.edge_fpg<=-2?'var(--warn)':'inherit'}">${sg(p.edge_fpg)}</b>`:'<span class="hint">—</span>'}</td>
      <td class="num" data-label="Next season">${p.fpg_next!=null?fmt1(p.fpg_next):'<span class="hint">—</span>'}${p.gp_next!=null?` <span class="hint">${p.gp_next}gp</span>`:''}</td>
      <td class="num" data-label="Result">${res}</td>
    </tr>`+(open.has(p.id)?`<tr class="detail"><td colspan="10"><div class="detailGrid" style="--lc:1fr"><div><div class="simwrap"><div class="lbl">Why he was flagged</div><div class="teambox">${p.break_why||'—'}</div></div>${p.adp!=null?`<div class="note">ESPN ADP: ${p.adp.toFixed(0)}</div>`:''}</div></div></td></tr>`:'');
  }).join('');
  document.getElementById('body').innerHTML=body||'<tr><td colspan="10" style="text-align:center;padding:2rem;color:var(--ink-faint)">no matches</td></tr>';
  collapseLegends(document.getElementById('boardPane'));
}
function fillYearSelect(){
  const sel=document.getElementById('brkYear');
  const yrs=Object.keys(H||{}).map(Number).sort((a,b)=>b-a);
  const m=D.breakout_meta;
  sel.innerHTML=`<option value="live">${m.frozen?'🔒 '+m.live_season+' (frozen preseason ledger)':'Live: '+m.live_season+' preview (not frozen)'}</option>`+
    yrs.map(y=>`<option value="${y}">${seasonLbl(y+1)} season (predicted after ${seasonLbl(y)})</option>`).join('');
  sel.value=brkYear;
}

function render(){
  if(kind==='breakout' && brkYear!=='live' && H){ renderHist(); return; }
  const rows = rowsFiltered();
  const cur = D.players.filter(p=>p.kind==='current').length;
  const pro = D.players.filter(p=>p.kind==='prospect').length;
  document.getElementById('statbar').innerHTML = `
    <div><b>${cur}</b>current players</div>
    <div><b>${pro}</b>prospects (not yet debuted)</div>
    <div><b>${rows.length}</b>showing</div>`;
  document.getElementById('legend').innerHTML = kind==='breakout' ? (()=>{
    const m=D.breakout_meta, e=m.pools.emergence, l=m.pools.elevation, a=m.adp.listed, bu=m.bust, av=m.availability, te=m.total_edge, vt=m.vor_test, pr=m.projection;
    const pc=v=>(v*100).toFixed(0)+'%';
    const status = m.frozen ? `🔒 <b>Frozen ${new Date(m.frozen_at).toLocaleDateString()}</b> — these are the locked preseason predictions.`
      : `⚠ <b>Not frozen yet</b> — this is a live preview that changes whenever data is refreshed. The ledger locks at the ${m.opener} season opener${new Date()>=new Date(m.opener)?' — <b>that date has passed; run freeze_breakout_ledger.py</b>':''}.`;
    return `${status}<br>
    <b>Breakout chance</b> = probability of a real +6 pts/g jump next season (30-game floor), from stats/role/situation only — <i>independent of ADP</i>. <b>Emerging</b> = crosses the ${oppCost(3).toFixed(1)} pts/g relevance line (landing within 1 pt counts); <b>Elevating</b> = already-good players who jump again. <b>Bust risk</b> = chance of a 6+ pts/g drop (elevating pool only).
    <details style="margin-top:.4rem"><summary style="cursor:pointer;color:var(--ink-soft)">How to read the columns, and how well each one tested</summary>
    <div style="margin-top:.4rem">
    <b>Backtests</b> (2015-24, each year fit only on earlier years): Emerging AUC ${e.full.auc.toFixed(2)} (top-10% hit ${pc(e.full.top10)} vs ${pc(e.full.base)} base); Elevating AUC ${l.full.auc.toFixed(2)} (${pc(l.full.top10)} vs ${pc(l.full.base)}); Bust AUC ${bu.full.auc.toFixed(2)} (top-10% flagged dropped 6+ ${pc(bu.full.top10)} of the time vs ${pc(bu.full.base)}).<br>
    <b>Proj next (10–90%)</b> = expected next-season pts/g and the range 80% of outcomes fell in (error ${pr.rmse.toFixed(1)} pts/g vs ${pr.rmse_naive.toFixed(1)} just repeating last year).<br>
    <b>Proj GP</b> = expected games played from GP history/age/role (off by ~${av.rmse_games.toFixed(0)} games on average vs ~${av.rmse_games_naive_last_year.toFixed(0)} just repeating last year — availability is mostly luck).<br>
    <b>Edge vs ADP</b> = model's expected pts/g minus what ESPN's draft price implies (ADP-listed players only). Top-10% edge picks beat ADP-implied output by +${a.top10_mean_surprise.toFixed(1)} pts/g (${pc(a.top10_hit_5)} beat it by 5+ vs ${pc(a.base_hit_5)} overall).
    <b>Season-total edge</b> = same idea in <i>season-total points</i> (pts/g × games). Additional info only, and a humbler result: the per-game edge picks did <b>not</b> beat ADP in season totals (${te.top10_total_surprise_by_pergame_edge.toFixed(0)} pts vs ADP-implied), because injuries eat the per-game advantage; ranking by the total edge itself gave +${te.top10_total_surprise_by_total_edge.toFixed(0)} pts (small next to ~${te.rmse_total_adp_only.toFixed(0)} pts of random season-to-season noise). Read per-game edge and injury risk together.<br>
    <b>VOR + breakout</b> = VOR after adding the breakout odds <i>beyond what age + output already imply</i> × how long a breakout's jump persists. Kept as a separate column because folding odds into projections only cut error ${((1-vt.h1.rmse_base_plus_breakout_odds/vt.h1.rmse_base)*100).toFixed(1)}% at 1 year and ${((1-vt.h3.rmse_base_plus_breakout_odds/vt.h3.rmse_base)*100).toFixed(1)}% at 3 years — too small to justify changing the core trajectories (tested against a simple proxy, not the Kalman model itself).<br>

h the calibrated college-profile projection (picks 1-10; late picks use the empirical model alone). Weights were chosen on held-out seasons. <b>Asset</b> = an overall, keeper-count-aware snapshot (the "what is this player worth to own" number): next season always counts, future seasons only count where he'd clear the keep cutoff for this many keepers per team (none at 0 = pure redraft; up to nearly everyone at 19 = full dynasty), weighted by career-survival odds and real historical outcome spread (young high-ceiling players carry upside, older players fade). Slide the keeper count to see young players rise and old high-scorers fall; <b>VOR</b> (below) stays the keep-vs-draft decision tool. <b>VOR</b> = value above opportunity cost, summed over each season your keeper trajectory stays above what you'd get back drafting fresh (stops at the first year it dips below) — <span class="kind rookie" style="font-size:.66rem">ROOKIE</span> not yet debuted (🌐 = international pathway), <span style="color:var(--accent)">●</span>/<span style="color:var(--warn)">●</span> injury-risk watch/chronic. Adjust the keeper count above to see value shift with league format.`;

/* Section helper for the This week page: collapsible cards with a remembered open/closed state and a jump bar. */
const secState={};
function sec(id,title,meta,inner,def=true){
  if(!inner) return '';

  return `<details class="sec" id="sec-${id}" data-sec="${id}" data-title="${esc(title)}" ${o?'open':''}><summary><span class="secT">${title}</span>${meta?`<span class="secM">${meta}</span>`:''}</summary><div class="secB">${inner}</div></details>`;
}
function wrapHdr(id,html,def=true){
  if(!html) return '';
  const m=html.match(/^\s*<div style="font-family:'IBM Plex Mono'[^>]*>([\s\S]*?)<\/div>/);
  if(!m) return sec(id,id,'',html,def);
  const t=m[1], k=t.search(/[:·(]/);
  return sec(id,k>0?t.slice(0,k).trim():t,k>0?t.slice(t[k]==='('?k:k+1).trim():'',html.slice(m[0].length),def);
}

else. Opponent totals assume they also play their best lineups, and win chance uses a 253-point weekly spread measured last season. ${M.calendar_assumed?'<b>Matchup dates for 2026-27 are assumed</b> (6-day opener, then Monday–Sunday weeks) until ESPN publishes them in season. ':''}Games already tipped today can't be changed; late swaps are possible until each game starts.</div>`;

const isMobile=()=>window.matchMedia('(max-width:720px)').matches;
function mobileTables(pane){
  pane.querySelectorAll('table:not(.heat)').forEach(t=>{
    const heads=[...t.querySelectorAll('thead th')].map(h=>h.textContent.trim());
    if(!heads.length) return;
    t.classList.add('mcards');
    if(heads[0]==='Day') t.classList.add('dayTbl');
    else if(heads[0]==='#' && heads.includes('Net gain')) t.classList.add('moveTbl');
    else if(heads[0]==='#') t.classList.add('leagueTbl');
    else if(heads[0]==='Add') t.classList.add('addTbl');
    else if(heads[0]==='Priority') t.classList.add('ltTbl');
    else if(heads[0]==='Player' && heads.includes('Injury')) t.classList.add('injTbl');
    else if(heads[0]==='Player' && heads.includes('Asset rank')) t.classList.add('rosterTbl');
    t.querySelectorAll('tbody tr').forEach(tr=>{
      [...tr.children].forEach((td,i)=>{ if(!td.hasAttribute('colspan') && heads[i]!=null) td.setAttribute('data-label',heads[i]); });
    });
  });
}
const legendState={};   // remembered open/closed state per pane and legend, so re-rendering (e.g. ticking a checkbox) does not reopen what you closed
function collapseLegends(root){
  root.querySelectorAll('.legend').forEach((l,idx)=>{
    if(l.querySelector(':scope > details.lg')) return;
    const key=(root.id||'root')+':'+idx;
    const open=key in legendState?legendState[key]:false;
    l.innerHTML=`<details class="lg" ${open?'open':''}><summary>${l.textContent.trim().startsWith('How to use this page')?'How to use this page to make decisions':'How to read this'}</summary>${l.innerHTML}</details>`;
    l.querySelector('details.lg').addEventListener('toggle',e=>{ legendState[key]=e.target.open; });
  });
}
const activeView=()=>{const b=document.querySelector('#segView button[aria-pressed="true"]'); return b?b.dataset.v:null;};
function setView(v){
  const b=document.querySelector(`#segView button[data-v="${v}"]`); if(b && b.style.display!=='none') b.click();

function signalsHtml(T){
  const st=TR.meta.signal_study||{};
  const row=r=>`<div class="tradeRow small"><b>${esc(r.name)}</b> ${r.team?`<span class="hint">${esc(r.team)}</span>`:''} · ${r.fpg} pts/g${r.hist!=null?` (before: ${r.hist})`:''} · expected ${r.extra>0?'+':''}${r.extra} beyond normal aging${r.why.length?`<br><span class="hint">${r.why.map(esc).join('; ')}</span>`:''}</div>`;
  if(!(T.sell_high||[]).length&&!(T.buy_low||[]).length) return '';
  return `<details class="profCard" style="margin:.4rem 0 1rem"><summary style="cursor:pointer;font-weight:600">Sell-high on your roster · buy-low elsewhere <span class="hint">(mild evidence, see note)</span></summary>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;margin-top:.5rem">
    <div><div class="hint" style="margin-bottom:.2rem">Sell-high (yours)</div>${(T.sell_high||[]).map(row).join('')||'<div class="hint">none flagged</div>'}</div>
    <div><div class="hint" style="margin-bottom:.2rem">Buy-low (other teams)</div>${(T.buy_low||[]).map(row).join('')||'<div class="hint">none flagged</div>'}</div></div>
    <div class="note" style="margin-top:.5rem">Tested on 2021-24 seasons (out of sample): the reversion model barely beats "normal aging alone" (error ${st.mae_persistence} to ${st.mae_model} pts/g). What holds up: big jumps above expectation fall back a bit (about 2 pts/g); players whose minutes jumped 4+ tend to give some back; big slumps do <b>not</b> reliably rebound, and injury-shortened seasons do <b>not</b> reliably bounce back. Treat these as tie-breakers, not reasons to trade.</div></details>`;
}

function formTag(f,always){
  if(typeof f==='string') f=W&&W.form?W.form[f]:null;
  if(!f||f.d==null) return '';

/* ---------------- Redraft board: rest-of-season value (redraft_data.json, built by the daily local refresh) ---------------- */
let RD=null, rdSort={k:'vor',asc:false}, rdQ='', rdFilter='all', rdPos='all', rdOpen=new Set(), rdLimit=60, rdRefocus=false;

function rdChart(p,W2=620,H2=250){

function rdOwner(p){ return RD._own?RD._own.get(p.id)||null:null; }

/* best lineup for a set of players {ef, slots:Set}: greedy by expected points with a matching check (a matroid, so greedy is optimal) */
function lineupValue(players){
  const list=players.slice().sort((a,b)=>b.ef-a.ef), match={}; const accepted=[];
  const go=(pi,seen)=>{ for(let si=0;si<DSLOTS.length;si++){ if(seen.has(si)||!list[pi].slots.has(DSLOTS[si])) continue; seen.add(si); if(match[si]===undefined||go(match[si],seen)){ match[si]=pi; return true; } } return false; };
  list.forEach((pl,i)=>{ if(go(i,new Set())) accepted.push(i); });
  const inLineup=new Set(accepted); const bench=list.filter((_,i)=>!inLineup.has(i));
  const value=accepted.reduce((a,i)=>a+list[i].ef,0)+0.2*bench.slice(0,3).reduce((a,x)=>a+x.ef,0);
  const assign=DSLOTS.map((sl,si)=>({slot:sl,pl:match[si]!==undefined?list[match[si]]:null}));
  return {value,assign,bench};

/* ===================== KEEPERS (Players > Keepers) =====================
   Compares SETS of keepers for the user's roster. For each candidate set S (keepers cost only a roster slot; everyone else on the roster goes back into the draft pool):
     season   = 73 x best-lineup value of S plus the players the set is expected to draft at the user's next picks (Monte Carlo draft: other teams pick by ADP with noise and
                their owner tendencies, the user picks by lineup fit plus a dynasty term), each player discounted by his expected missed games
     future   = sum of the top-5 next-year keeper assets (asset at 5 keepers) among S plus those draftees
     total    = season + w x 73 x future          (w = the win-now / future slider)
   Other teams' keepers are projected (each team's top 3 by asset) until ESPN shows the real ones. */
let kSel=null, kW=0.25, kCache={sig:'',res:null}, kK=null;
function kef(p){ const lvl=p.espn||p.ours||0, h=p.hub; const miss=(h&&h.injury_missed!=null)?h.injury_missed:(p.kind==='prospect'?10:20), f=Math.min(0.9,miss/82); return lvl*(1-f)+DREPL*f; }   // games he misses are covered by a replacement-level player
function kmiss(p){ const h=p.hub; return (h&&h.injury_missed!=null)?h.injury_missed:null; }
function krng(seed){ let a=seed>>>0; return ()=>{ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
const ktop5=a=>a.map(x=>x.asset5||0).sort((x,y)=>y-x).slice(0,5).reduce((s,v)=>s+v,0);
function kAdpOrd(p){ return p.adp!=null?p.adp:(p.rk?p.rk*1.15:900); }

function kDraftSim(M,S,w,N,seed){
  const myId=DR.my_id, sched=draftSchedule();
  const mine=sched.filter(x=>x.team===myId).slice(0,6); if(!mine.length) return null;
  const lastN=mine[mine.length-1].n, seq=sched.filter(x=>x.n<=lastN);
  const skeys=new Set(S.map(p=>p.id));
  const pool=[...M.all.values()].filter(p=>!(M.kept.has(p.id)&&M.kept.get(p.id)!==myId)&&!skeys.has(p.id)&&p.slots).map(p=>Object.assign({},p,{ef:kef(p)})).sort((a,b)=>kAdpOrd(a)-kAdpOrd(b));
  const released=DR.teams.find(t=>t.id===myId).roster.map(r=>M.all.get(String(r.id))).filter(p=>p&&!skeys.has(p.id));   // my roster players not kept go back into the pool
  const rnd=krng(seed), gum=()=>-Math.log(-Math.log(rnd()+1e-12)+1e-12);
  const tr=new Map(); seq.forEach(x=>{ if(x.team!==myId&&!tr.has(x.team)) tr.set(x.team,traitsFor(x.team)); });
  const base=pool.map(p=>({p,yn:p.age==null?0:Math.max(-1,Math.min(1,(26-p.age)/6)),rk:p.kind==='prospect',inj:p.status&&p.status!=='ACTIVE'}));
  const mineBase=S.map(p=>Object.assign({},p,{ef:kef(p)}));
  let seasonSum=0, futureSum=0; const pickFreq=mine.map(()=>new Map()), avail=new Map(), availN=[0,0,0];
  for(let s=0;s<N;s++){
    const gone=new Uint8Array(base.length), goneO=new Uint8Array(base.length); const my=mineBase.slice(); let mi=0;
    for(const x of seq){
      if(x.team===myId){
        let lv0=lineupValue(withRepl(my)).value, t0=ktop5(my), bestI=-1, bv=-1e9, seen=0;
        for(let i=0;i<base.length&&seen<30;i++){ if(gone[i]) continue; seen++; const p=base[i].p;
          const v=73*(lineupValue(withRepl(my.concat([p]))).value-lv0)+w*73*(ktop5(my.concat([p]))-t0);
          if(v>bv){bv=v;bestI=i;} }
        if(mi<3) released.forEach(r=>{ const idx=base.findIndex(b=>b.p.id===r.id); const rec=avail.get(r.id)||[0,0,0]; if(idx<0||!goneO[idx]) rec[mi]++; avail.set(r.id,rec); });
        if(bestI>=0){ gone[bestI]=1; my.push(base[bestI].p); const f=pickFreq[mi]; f.set(base[bestI].p.name,(f.get(base[bestI].p.name)||0)+1); }
        mi++;
      } else {
        const T=tr.get(x.team)||null; let bi=-1,bv=-1e9,seen=0;
        for(let i=0;i<base.length&&seen<40;i++){ if(gone[i]) continue; seen++; const b=base[i];
          let u=-seen; if(T){ u+=3.0*T.youth*b.yn+2.0*T.rookie*(b.rk?1:0)+2.0*T.injury*(b.inj?1:0); }
          u+=gum()*(1.5+0.12*seen); if(u>bv){bv=u;bi=i;} }
        if(bi>=0){ gone[bi]=1; goneO[bi]=1; }
      }
    }
    seasonSum+=73*lineupValue(withRepl(my)).value; futureSum+=ktop5(my);
  }
  const top=pickFreq.map(f=>[...f.entries()].sort((a,b)=>b[1]-a[1]).slice(0,3).map(([n,c])=>({name:n,pct:c/N})));
  const av={}; avail.forEach((v,k)=>{ av[k]=v.map(c=>c/N); });
  return {season:seasonSum/N,future:futureSum/N,top,avail:av,picks:mine.map(x=>`Rd ${x.k}.${x.pos}`)};
}
function kCombos(arr,k){ const out=[]; const go=(st,cur)=>{ if(cur.length===k){ out.push(cur.slice()); return; } for(let i=st;i<arr.length;i++){ cur.push(arr[i]); go(i+1,cur); cur.pop(); } }; go(0,[]); return out; }

function kCompute(M,K,w,forceSet){
  const myTeam=DR.teams.find(t=>t.id===DR.my_id);
  const roster=myTeam.roster.map(r=>M.all.get(String(r.id))).filter(Boolean).map(p=>Object.assign({},p,{ef:kef(p)}));
  const cand=roster.slice().sort((a,b)=>(b.ef*0.6+(b.asset5||0)*0.25)-(a.ef*0.6+(a.asset5||0)*0.25)).slice(0,Math.max(K+5,11));
  const sets=kCombos(cand,K).map(S=>({S,quick:73*lineupValue(withRepl(S)).value+w*73*ktop5(S)})).sort((a,b)=>b.quick-a.quick);
  const chosen=sets.slice(0,8); const sig=x=>x.S.map(p=>p.id).sort().join(',');
  if(forceSet&&!chosen.some(x=>sig(x)===forceSet.map(p=>p.id).sort().join(','))) chosen.push({S:forceSet,quick:0});
  chosen.forEach((x,i)=>{ x.sim=kDraftSim(M,x.S,w,28,1000+i); x.total=x.sim?x.sim.season+w*73*x.sim.future:x.quick; });
  chosen.sort((a,b)=>b.total-a.total);
  return {roster,chosen};
}

function renderKeepers(){

        <td class="num">${x.sim?x.sim.season.toFixed(0):'—'}</td><td class="num">${x.sim?x.sim.future.toFixed(0):'—'}</td><td class="num"><b>${x.total.toFixed(0)}</b></td><td class="num ${x.total-best.total<-0.5?'':'hint'}">${(x.total-best.total).toFixed(0)}</td></tr>`;}).join('');
    // sensitivity: same simulated sets, different weight on the future
    const sens=[0.05,0.25,0.5].map(w=>{ const bs=res.chosen.slice().sort((a,b)=>(b.sim.season+w*73*b.sim.future)-(a.sim.season+w*73*a.sim.future))[0]; return `<div class="kSens"><b>${w===0.05?'Win-now (0.05)':w===0.25?'Balanced (0.25)':'Future-heavy (0.50)'}</b>: ${bs.S.map(p=>esc(p.name)).join(' + ')}</div>`; }).join('');
