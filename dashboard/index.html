<script>
let rowLimit=60, lastSig='', D=null, H=null, brkYear='live', kind='all', brkType='all', q='', K=5, PROF=null, DR=null, dq='', dpos='all', dsort={k:'score',asc:false}, weekAfter=false, LIVE=null, SP=null, schedTeam=null, schedSort='playoffs', dHide=true, dShowDrafted=false, dDynPicks=3, dWEarly=0.40, dWLate=0.08, dOpen=null, dLive=false, TR=null, tradeTeam=null, tradeW=0.10, tradeRatio=0.95, tradeS=null, W=null, weekTeam=null, L=null, ownerFilter='all', teamSel=null, sort={k:'asset',asc:false}, open=new Set();

function oppCost(k){ return D.opportunity_cost.floor + D.opportunity_cost.amp * Math.exp(-k/D.opportunity_cost.tau); }
function computeVOR(traj, k){
  if(!traj||!traj.length) return {vor:0, years:0};
  const opp = oppCost(k);
  let total=0, years=0;
  for(const v of traj){ if(v < opp) break; total += v-opp; years++; }
  return {vor: Math.round(total*10)/10, years};
}
const fmt1=v=>v==null?'—':v.toFixed(1);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=n=>String(n||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/ jr\.?$| sr\.?$| iii$| ii$| iv$/,'').replace(/[^a-z]/g,'');
let OWNER=new Map();  // hub player id -> {abbrev,name,team,slot}
function initLeague(){
  OWNER=new Map();
  for(const t of L.teams) for(const r of t.roster) if(r.id) OWNER.set(r.id,{abbrev:t.abbrev,name:t.name,team:t.id,slot:r.slot});
  const sel=document.getElementById('ownerSel');
  sel.innerHTML='<option value="all">All players</option><option value="fa">Free agents</option><option value="rostered">Rostered</option>'+L.teams.map(t=>`<option value="t${t.id}">${esc(t.abbrev)} · ${esc(t.name)}</option>`).join('');
  sel.style.display=''; document.getElementById('teamsBtn').style.display=''; 
  sel.addEventListener('change',e=>{ownerFilter=e.target.value; render();});
}
const yearLabel=(anchorYear,k)=>`'${String(anchorYear+k).slice(-2)}`;

// 5-year change (not the full 7) -- year 6-7 is often just a slow decline
// off a peak already reached, so a 7-year delta understates how good the
// near/mid-term climb actually is. The line itself still shows all 7.
function trajDelta5yr(traj){
  if(!traj||!traj.length) return 0;
  const base = traj[0] || 1;
  const idx = Math.min(4, traj.length-1);
  return (traj[idx]-traj[0])/base;
}

// Normalized (% of year-1 value) so shape is comparable across players
// regardless of absolute magnitude, colored by net direction (rising =
// good, falling = warn) with the peak point marked -- a raw-value sparkline
// of these mostly-smooth curves looked nearly identical row to row.
function sparkline(traj, w=56, h=26){
  if(!traj||!traj.length) return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"></svg>`;
  const base = traj[0] || 1;
  const rel = traj.map(v => v/base);
  const max=Math.max(...rel,1.02), min=Math.min(...rel,0.98);
  const span=Math.max(max-min,0.02);
  const pts=rel.map((v,i)=>[ (i/(rel.length-1)*w), (h-((v-min)/span)*h) ]);
  const peakIdx = traj.indexOf(Math.max(...traj));
  const netChange = trajDelta5yr(traj);
  const dir = netChange > 0.03 ? 'up' : netChange < -0.03 ? 'down' : 'flat';
  const color = dir==='up' ? 'var(--good)' : dir==='down' ? 'var(--warn)' : 'var(--ink-faint)';
  const line = pts.map(p=>p.join(',')).join(' ');
  const peakDot = `<circle cx="${pts[peakIdx][0].toFixed(1)}" cy="${pts[peakIdx][1].toFixed(1)}" r="2.2" fill="${color}"/>`;
  const svg = `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="1.8"/>${peakDot}
  </svg>`;
  const deltaTxt = (netChange>=0?'+':'') + (netChange*100).toFixed(0) + '%';
  return `<div class="sparkCell">${svg}<span class="sparkDelta ${dir}" title="5-year change">${deltaTxt}</span></div>`;
}

// Real trailing seasons + projected future on one continuous timeline, so
// an implausible-looking projection (e.g. a "future peak" for a player
// whose real recent seasons already show clear decline) is immediately
// visible against the real trend it's supposed to continue from.
function trajChart(traj, opp, anchorYear, histYears=[], histValues=[], ceil=null, w=460, h=160){
  const futYears = traj.map((_,i)=>anchorYear+i);
  const allYears = [...histYears, ...futYears];
  const allValues = [...histValues, ...traj];
  const n = allYears.length;
  const histCount = histYears.length;
  const max=Math.max(...allValues, opp, ...(ceil||[]))*1.08, min=0;
  const span=Math.max(max-min,1);
  const pad=26;
  const iw=w-pad*2, ih=h-pad*1.7;
  const x=i=>pad+(n<=1?0:(i/(n-1))*iw);
  const y=v=>pad*0.6+ih-((v-min)/span)*ih;
  const ptsFor=(from,to)=>allValues.slice(from,to+1).map((v,k)=>`${x(from+k).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const oppY=y(opp).toFixed(1);
  const histPts = histCount>0 ? ptsFor(0, histCount-1) : '';
  // future line starts at the last history point (or first future point if no history) for visual continuity
  const futStart = histCount>0 ? histCount-1 : 0;
  const futPts = ptsFor(futStart, n-1);
  let ceilLine='';
  if(ceil){
    const base=histCount, m=Math.min(ceil.length, traj.length);

function rookieStatLine(proj){

  const min=proj.MIN||0;

    ['BLK',per('BLK')],['3PM',per('FG3M')],['TOV',per('TOV')],['MIN',min]];
  return `<div class="statline">${rows.map(([l,v])=>`<div class="s"><div class="v">${v.toFixed(1)}</div><div class="l">${l}</div></div>`).join('')}</div>`;
}

function assetRanks(){

function rowsFiltered(){
  let r = D.players;
  if(kind==='breakout'){
    r = r.filter(p => p.p_break!=null);
    if(brkType==='emergence'||brkType==='elevation'||brkType==='rookie') r = r.filter(p=>p.brk_tier===brkType);
    else if(brkType==='radar') r = r.filter(p=>p.edge_fpg!=null && p.edge_fpg>=2);
    else if(brkType==='bust') r = r.filter(p=>p.p_bust!=null);
  }
  else if(kind!=='all') r = r.filter(p => p.kind===kind);
  if(q) r = r.filter(p => p.player.toLowerCase().includes(q.toLowerCase()));
  if(L && ownerFilter!=='all'){
    r = r.filter(p => { const o=OWNER.get(p.id);
      return ownerFilter==='fa' ? !o : ownerFilter==='rostered' ? !!o : (o && 't'+o.team===ownerFilter); });
  }
  const assetRank = assetRanks();
  r = r.map(p => ({...p, _owner: OWNER.get(p.id)||null, _asset: p.asset_k?p.asset_k[K]:null, _market: p.market_rank!=null?p.market_rank:null, _mgap: (p.market_rank!=null&&assetRank.get(p.id))?p.market_rank-assetRank.get(p.id):null, _ceilVor: p.ceil_path?computeVOR(p.ceil_path, K).vor:null, _ceilAsset: p.ceil_asset_k?p.ceil_asset_k[K]:null, _assetRank: assetRank.get(p.id), _vor: computeVOR(p.trajectory, K), _vorB: p.trajectory_brk?computeVOR(p.trajectory_brk, K):null, _trajDelta: trajDelta5yr(p.trajectory)}));
  r.sort((a,b)=>{
    let av,bv;
    if(sort.k==='vor'){av=a._vor.vor;bv=b._vor.vor;}
    else if(sort.k==='asset'){av=a._asset;bv=b._asset;}
    else if(sort.k==='owner'){av=a._owner?a._owner.abbrev:null;bv=b._owner?b._owner.abbrev:null;}
    else if(sort.k==='market'){av=a._market!=null?-a._market:null;bv=b._market!=null?-b._market:null;}
    else if(sort.k==='ceil_vor'){av=a._ceilVor;bv=b._ceilVor;}
    else if(sort.k==='ceil_asset'){av=a._ceilAsset;bv=b._ceilAsset;}
    else if(sort.k==='vor_brk'){av=a._vorB?a._vorB.vor:null;bv=b._vorB?b._vorB.vor:null;}
    else if(sort.k==='sparkline'){av=a._trajDelta;bv=b._trajDelta;}
    else if(sort.k==='player'){av=a.player;bv=b.player;}
    else {av=a[sort.k];bv=b[sort.k];}
    if(av==null) av=(sort.k==='adp'&&sort.asc)?Infinity:-Infinity; if(bv==null) bv=(sort.k==='adp'&&sort.asc)?Infinity:-Infinity;
    if(typeof av==='string') return sort.asc ? av.localeCompare(bv) : bv.localeCompare(av);
    return sort.asc ? av-bv : bv-av;
  });
  return r;
}

  return `<details class="sec" id="sec-${id}" data-sec="${id}" data-title="${esc(title)}" ${o?'open':''}><summary><span class="secT">${title}</span>${meta?`<span class="secM">${meta}</span>`:''}</summary><div class="secB">${inner}</div></details>`;
}
function wrapHdr(id,html,def=true){
  if(!html) return '';
  const m=html.match(/^\s*<div style="font-family:'Barlow Condensed'[^>]*>([\s\S]*?)<\/div>/);
  if(!m) return sec(id,id,'',html,def);
  const t=m[1], k=t.search(/[:·(]/);

/* ===== MATCHUP VIEW (Today): both lineups for a chosen day. Today uses the live tracker when it has this matchup (live points, game clock); other days use the
   plan (your column includes the planned moves; the opponent's is his projected best lineup). */
let MU_DAY=null;
const shortName=n=>{ const p=String(n).split(' '); return p.length>1?p[0][0]+'. '+p.slice(1).join(' '):n; };
const SLOT_ORD={PG:0,SG:1,SF:2,PF:3,C:4,G:5,F:6,'SG/SF':7,'G/F':8,'PF/C':9,'F/C':10,UT:11};
function matchupHtml(T,O,M,liveOk){
  if(!O) return '';
  const days=M.planned_days||[], today=days[0];
  if(!days.length) return '';
  if(!MU_DAY||!days.includes(MU_DAY)) MU_DAY=today;
  const live=liveOk&&LIVE.me&&LIVE.me.lineup&&MU_DAY===today;
  const adds=new Map((T.sequence||[]).map(a=>[a.add.name,a]));
  const tipT=iso=>iso?new Date(iso).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}).replace(':00','').replace(' ',''):'';
  let mine=[], theirs=[], hm={}, ho={};
  if(live){
    const conv=x=>({name:x.name,slot:x.slot,st:x.st,pts:x.pts,proj:x.proj,sub:x.st==='final'?'Final':(x.st==='live'?x.clock.replace(' - ',' '):(x.st==='out'?'Out':tipT(x.tip)))});
    mine=LIVE.me.lineup.map(conv); theirs=LIVE.opp.lineup.map(conv);
    const tot=a=>a.reduce((s,x)=>s+(x.pts||0),0);
    hm={big:'+'+tot(mine).toFixed(1),lbl:'today',s0:LIVE.me.starts_before_today,s1:LIVE.me.starts_end_today};
    ho={big:'+'+tot(theirs).toFixed(1),lbl:'today',s0:LIVE.opp.starts_before_today,s1:LIVE.opp.starts_end_today};
  } else {
    const myDays=(T.days_after&&(T.sequence||[]).length)?T.days_after:T.days;
    const dm=myDays.find(d=>d.date===MU_DAY), dop=(O.days||[]).find(d=>d.date===MU_DAY);
    const conv=(x,mineSide)=>{ const a=mineSide?adds.get(x.name):null; const ifp=x.p>0?x.ef/x.p:x.ef;
      return {name:x.name,slot:x.slot,st:'pre',pts:null,proj:Math.round(ifp),sub:a?(a.add.waiver?'+ claim':'+ add'):tipT(x.tip),planned:!!a}; };
    mine=dm&&!dm.locked?dm.start.map(x=>conv(x,true)):[]; theirs=dop&&!dop.locked?dop.start.map(x=>conv(x,false)):[];
    const pj=a=>a.reduce((s,x)=>s+x.proj,0);
    hm={big:pj(mine).toFixed(0),lbl:'projected',s0:dm?dm.starts_before:null,s1:dm?dm.starts_after:null,locked:dm&&dm.locked};
    ho={big:pj(theirs).toFixed(0),lbl:'projected',s0:dop?dop.starts_before:null,s1:dop?dop.starts_after:null,locked:dop&&dop.locked};
  }
  const bySlot=(a,b)=>(SLOT_ORD[a.slot]??20)-(SLOT_ORD[b.slot]??20);
  mine.sort(bySlot); theirs.sort(bySlot);
  const n=Math.max(mine.length,theirs.length);
  const cap=M.cap;
  // bar scaled to the most starts that can count: start a day under the cap and that whole day counts, so the most is (highest whole number under the cap) + 10 slots
  const maxStarts=Math.ceil(cap-1e-9)-1+10, capPct=cap/maxStarts*100;
  const capBar=(h,right)=>{ if(h.s0==null) return ''; const a=Math.min(100,h.s0/maxStarts*100), b=Math.max(0,Math.min(100,h.s1/maxStarts*100)-a);
    return `<div class="muCap"><b>${Math.round(h.s0)}</b> &rarr; ${Math.round(h.s1)} of ${maxStarts} max · cap ${Math.round(cap)}${h.locked?' <span class="liveStatus">capped</span>':''}</div><div class="muBar${right?' r':''}"><i style="width:${a}%"></i><i class="add" style="width:${b}%"></i><b class="muTick" style="${right?'right':'left'}:${capPct.toFixed(1)}%"></b></div>`; };
  const row=x=>x?`<div class="muPl ${x.st}${x.planned?' planned':''}"><span class="muSlot">${esc(x.slot)}</span><span class="muWho"><span class="pName" data-pc="${esc(x.name)}" role="button" tabindex="0">${esc(shortName(x.name))}</span><small>${esc(x.sub||'')}</small></span><span class="muPts">${x.pts!=null?x.pts.toFixed(1):(x.st==='out'?'—':(x.st==='live'||x.st==='final'?'0.0':x.proj))}</span></div>`
    :`<div class="muPl empty"><span class="muSlot">—</span><span class="muWho">open slot</span><span class="muPts"></span></div>`;
  const colHtml=a=>Array.from({length:n},(_,i)=>row(a[i])).join('');
  const chips=days.map(d=>{ const lbl=d===today?'Today':shortDay(d); const isLive=d===today&&liveOk&&LIVE.me&&(LIVE.me.lineup||[]).some(x=>x.st==='live');
    return `<button type="button" class="muChip${d===MU_DAY?' on':''}" data-mud="${d}">${isLive?'<span class="muDot"></span>':''}${lbl}${isLive?' · live':''}</button>`; }).join('');
  const rem=a=>Math.round(a.filter(x=>x.st==='pre').reduce((s,x)=>s+x.proj*0.94,0)+a.filter(x=>x.st==='live').reduce((s,x)=>s+Math.max(0,x.proj-(x.pts||0))*0.5,0));
  const foot=live?`<div class="muFoot"><div>Still to come <b>~${rem(mine)}</b></div><div>Still to come <b>~${rem(theirs)}</b></div></div>`:'';
  return `<h2 class="todayH">Matchup ${ib('Starts')}</h2>
    <div class="muChips">${chips}</div>
    <div class="muBox">
      <div class="muHead"><div><div class="muTm"><span class="you">YOU</span> · ${esc(T.abbrev)}</div><div class="muBig">${hm.big} <span class="muLbl">${hm.lbl}</span></div>${capBar(hm,false)}</div>
        <div><div class="muTm">${esc(O.abbrev)}</div><div class="muBig"><span class="muLbl">${ho.lbl}</span> ${ho.big}</div>${capBar(ho,true)}</div></div>
      <div class="muRows"><div class="muCol">${colHtml(mine)}</div><div class="muCol r">${colHtml(theirs)}</div></div>
      ${foot}
    </div>
    ${live?'<div class="muLegend"><span class="l1">final</span><span class="l2">live</span><span class="l3">not started (projection)</span></div>':(MU_DAY===today?'':'<div class="muLegend"><span class="l4">+ planned move</span><span class="l3">projected points if he plays</span></div>')}`;
}

/* WHAT CHANGED SINCE YOU LAST LOOKED: the plan rebuilds on its own, so compare it with what you saw last time (kept on this device only) */
const SEEN_KEY='seen_plan_v1';
let SEEN_PREV=null, SEEN_NOW=null;
try{ SEEN_PREV=JSON.parse(localStorage.getItem(SEEN_KEY)||'null'); }catch(e){}
function planSnap(T,sb){ return {gen:W.generated, mp:W.matchup.id, wp:sb&&sb.wp!=null?Math.round(sb.wp*100):null,
  seq:(T.sequence||[]).map(a=>({add:a.add.name,drop:a.drop?a.drop.name:null,on:a.on,gain:Math.round(a.gain)}))}; }
function planChanges(T,sb){
  SEEN_NOW=planSnap(T,sb);
  const P=SEEN_PREV; if(!P||P.mp!==SEEN_NOW.mp||P.gen===SEEN_NOW.gen) return null;
  const key=x=>x.add, before=new Map(P.seq.map(x=>[key(x),x])), after=new Map(SEEN_NOW.seq.map(x=>[key(x),x]));
  const out=[];
  SEEN_NOW.seq.forEach(x=>{ const b=before.get(key(x)); if(!b) out.push(`New: add ${x.add}${x.drop?', drop '+x.drop:''} (${shortDay(x.on)}).`); else if(b.drop!==x.drop) out.push(`${x.add}: now drop ${x.drop||'nobody'} (was ${b.drop||'nobody'}).`); else if(b.on!==x.on) out.push(`${x.add}: moved to ${shortDay(x.on)} (was ${shortDay(b.on)}).`); });
  P.seq.forEach(x=>{ if(!after.has(key(x))) out.push(`Dropped from the plan: ${x.add}.`); });
  if(P.wp!=null&&SEEN_NOW.wp!=null&&Math.abs(SEEN_NOW.wp-P.wp)>=5) out.push(`Win chance ${P.wp}% -> ${SEEN_NOW.wp}%.`);
  return out.length?'Since you last looked: '+out.join(' '):null;
}
function saveSeen(){ if(SEEN_NOW){ try{ localStorage.setItem(SEEN_KEY,JSON.stringify(SEEN_NOW)); }catch(e){} } }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') saveSeen(); });
window.addEventListener('pagehide',saveSeen);

const sortCellVal=td=>{ if(!td) return null; if(td.dataset.sort!=null){ const n=+td.dataset.sort; return Number.isFinite(n)&&td.dataset.sort!==''?n:td.dataset.sort; }

  const rows=[...tb.rows], fixed=rows.filter(r=>r.cells.length===1||r.classList.contains('noSort')), body=rows.filter(r=>!fixed.includes(r));
  body.forEach((r,k)=>{ if(r.dataset.ord==null) r.dataset.ord=k; });

    if(x==null&&y==null) return a.dataset.ord-b.dataset.ord; if(x==null) return 1; if(y==null) return -1;

const GLOSS=[

  ['Expected','Projected points times his chance of playing. Used to total up a day or a week.'],
  ['Chance to play','For tonight it follows the official injury report (available 96%, probable 92%, questionable 57%, doubtful 4%, out 0% for rotation players). A healthy player with no tag is 94%, 89% on the second night of a back-to-back. Later days: 85% for rotation players, lower for fringe players.'],
  ['Cap','Only 40 started games count per 7-day matchup (scaled for longer or shorter matchups). It is checked at the start of each day: start a day under the cap and every start that day counts, even past 40; start it at or over and nothing counts.'],
  ['Starts','Started games used so far against this matchup\'s cap.'],
  ['Win chance','Your chance to win this matchup, from both teams\' projected totals and a 253-point weekly spread measured last season.'],
  ['Net gain',"What a move is worth, in points: this week's points, weighted by how much they change your chance of winning this matchup (about face value early in a close week, about double on a close last day, close to nothing once the week is decided), plus next week's points on the last two days, minus what it can cost later (for a rental, the chance the player you drop is gone before you re-add him; for a keep, the season-long gap between the two players). Moves worth less than about 6 are left out."],
  ['Season value','How much he would add to YOUR title odds over the rest of the season: his points above a replacement-level player each week, with fantasy-playoff weeks weighted by how much a point there decides the title (from the season simulation; a semifinal or final point is worth about 20x a regular-season point).'],
  ['Keeper value','What he is worth as a keeper: projected value above the keeper cutoff over the coming seasons, with later years discounted.'],
  ['Keeper rank','Where his keeper value ranks across the league (1 is the most valuable).'],
  ['Keeper value, best case','Keeper value if his development lands near the top of the likely range (90th percentile).'],
  ['Waivers','A player another team just dropped. Claims run at about 3am ET, at least 24 hours after the drop, in waiver order; anyone unclaimed becomes a free agent you can add instantly.'],
  ['Pts/wk','Average points per completed matchup. Matchups differ in length (the opener is 6 days, holiday weeks run longer), so compare within the same season.'],
  ['Opp pts/wk','Average points scored against the team per completed matchup: the schedule luck it has faced.'],
  ['All-play','The record a team would have if it played every other team every week. It measures strength without schedule luck.'],
  ['Luck','Actual wins minus the wins its all-play record says it should have. Plus means a kind schedule; it tends to even out.'],
  ['Proj pts/wk','Projected points per matchup over the next four matchups, from the current rosters and NBA schedules.'],
  ['Starts per matchup','Average started games per completed matchup this season, on the 40-game cap scale. Teams well under 40 leave points on the table.'],
  ['PO games','Games his NBA team plays in the fantasy playoffs (weeks 20-22), 9 to 12 across the league. A point in those weeks is worth far more to your title chances than a regular-season point.'],
  ['Proj','Projected final regular-season record, from the season simulation (19 matchups).'],
  ['PPS','Points per start: fantasy points divided by games started this season, including the matchup in progress. High means quality; a team can also win on volume.'],
  ['Inj pts/wk','Points per week the team is missing to injuries: its best 10 players with everyone healthy, minus its best 10 once each injured player is scaled by how much of the next week he is expected to miss. A star out counts in full; a bench player out barely counts, because he would not start anyway.'],
  ['Playoffs','Chance to make the playoffs, from simulating the rest of the season thousands of times.'],
  ['Bye','Chance of a top-two seed and a first-round bye.'],
  ['Title','Chance to win the league.'],
  ['Title trend','Title chances over the last four weeks; the number is the change over the last 7 days.'],

function rdOwner(p){ return RD._own?RD._own.get(p.id)||null:null; }
function rdRows(){

/* ============================================================

const INJL=['Low','Below typical','Typical','Elevated','High'];   // injury-risk tier names (shared)
const TEAM_SLUG={GSW:'gs',NOP:'no',SAS:'sa',NYK:'ny',UTA:'utah',WAS:'wsh'};
function teamLogoUrl(team){ if(!team) return ''; return `https://a.espncdn.com/i/teamlogos/nba/500/${TEAM_SLUG[team]||team.toLowerCase()}.png`; }
const SILHOUETTE='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#2a323c"/><circle cx="50" cy="38" r="18" fill="#4b5563"/><path d="M18 92c2-24 16-36 32-36s30 12 32 36" fill="#4b5563"/></svg>');
function headshotEl(nbaId,espnId,size=76){
  const chain=[]; if(nbaId) chain.push(`https://cdn.nba.com/headshots/nba/latest/1040x760/${nbaId}.png`);
  if(espnId) chain.push(`https://a.espncdn.com/i/headshots/nba/players/full/${espnId}.png`);
  chain.push(SILHOUETTE);
  const first=chain[0], rest=JSON.stringify(chain.slice(1));
  return `<img class="pcHead" width="${size}" height="${size}" src="${first}" data-fallback='${rest}' onerror="const c=JSON.parse(this.dataset.fallback||'[]'); if(c.length){ this.src=c.shift(); this.dataset.fallback=JSON.stringify(c); } else { this.onerror=null; }" alt=""/>`;
}
const pnorm=n=>norm(n||'');
function findPlayer(name){
  const key=pnorm(name); if(!key) return null;
  const out={name};
  if(typeof D!=='undefined'&&D&&D.players){ const h=D.players.find(p=>pnorm(p.player)===key); if(h){ out.hub=h; out.nbaId=h.id.slice(1); out.name=h.player; } }
  if(typeof W!=='undefined'&&W){
    for(const t of (W.teams||[])){ const r=(t.roster||[]).find(p=>pnorm(p.name)===key); if(r&&!out.week){ out.week=r; out.espnId=out.espnId||r.id; out.weekOwner=t; if(r.hub_id) out.nbaId=out.nbaId||r.hub_id.slice(1); } }

async function slFetch(name){

/* League draft order estimate (p.lk, smaller = goes earlier among players still to be drafted), used by the availability simulation. Backtested on this league's

   2023-26 rookie prices (top-3 NBA picks went around picks 1-9, picks 4-6 around 7-55, 7-10 around 40-105). Rookie prices are inherently noisy (a factor of ~2). */

function draftAdvice(M){

  M.pool.forEach(p=>{
    const lv=lineupValue(withRepl(M.mine.concat([p])));
    p.fit=(lv.value-base)*73;                       // season points from a better lineup (per-game gain x ~73 games)
    const top5=M.mine.concat([p]).map(x=>x.asset5).sort((a,b)=>b-a).slice(0,5).reduce((a,b)=>a+b,0);
    p.dyn=top5-baseTop5;                            // change in next year's top-5 keeper assets

/* Availability simulation: each team ahead of your pick chooses by ADP order (with noise that grows deeper in the list), nudged by that owner's draft profile

function traitsFor(teamId){

let simCache={sig:'',res:null};
function simulateAvail(M,PI){
  let nextMine=PI.mineLeft[0]; if(!nextMine) return null;

  if(gap<=0) return null;

  if(simCache.sig===sig) return simCache.res;

/* ===================== KEEPERS (Players > Keepers) =====================
   Compares SETS of keepers for the user's roster. For each candidate set S (keepers cost only a roster slot; everyone else on the roster goes back into the draft pool):
     season   = 73 x best-lineup value of S plus the players the set is expected to draft at the user's next picks (Monte Carlo draft: other teams pick by ADP with noise and
                their owner tendencies, the user picks by lineup fit plus a dynasty term), each player discounted by his expected missed games
     future   = sum of the top-5 next-year keeper assets (asset at 5 keepers) among S plus those draftees
     total    = season + w x 73 x future          (w = the win-now / future slider)
   Other teams' keepers are projected (each team's top 3 by asset) until ESPN shows the real ones. */
let kSel=null, kW=0.25, kCache={sig:'',res:null}, kK=null;
function kef(p){ const lvl=p.espn||p.ours||0, h=p.hub; const miss=(h&&h.injury_missed!=null)?h.injury_missed:(p.kind==='prospect'?10:20), f=Math.min(0.9,miss/82); return lvl*(1-f)+DREPL*f; }   // games he misses are covered by a replacement-level player
function kmiss(p){ const h=p.hub; return (h&&h.injury_missed!=null)?h.injury_missed:null; }
function krng(seed){ let a=seed>>>0; return ()=>{ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
const ktop5=a=>a.map(x=>x.asset5||0).sort((x,y)=>y-x).slice(0,5).reduce((s,v)=>s+v,0);
function kAdpOrd(p){ return p.lk!=null?p.lk:(p.adp!=null?p.adp:(p.rk?p.rk*1.15:900)); }

function kDraftSim(M,S,w,N,seed){
  const myId=DR.my_id, sched=draftSchedule();
  const mine=sched.filter(x=>x.team===myId).slice(0,6); if(!mine.length) return null;
  const lastN=mine[mine.length-1].n, seq=sched.filter(x=>x.n<=lastN);
  const skeys=new Set(S.map(p=>p.id));
  const pool=[...M.all.values()].filter(p=>!(M.kept.has(p.id)&&M.kept.get(p.id)!==myId)&&!skeys.has(p.id)&&p.slots).map(p=>Object.assign({},p,{ef:kef(p)})).sort((a,b)=>kAdpOrd(a)-kAdpOrd(b));
  const released=DR.teams.find(t=>t.id===myId).roster.map(r=>M.all.get(String(r.id))).filter(p=>p&&!skeys.has(p.id));   // my roster players not kept go back into the pool
  const rnd=krng(seed), gum=()=>-Math.log(-Math.log(rnd()+1e-12)+1e-12);
  const tr=new Map(); seq.forEach(x=>{ if(x.team!==myId&&!tr.has(x.team)) tr.set(x.team,traitsFor(x.team)); });
  const base=pool.map(p=>({p,yn:p.age==null?0:Math.max(-1,Math.min(1,(26-p.age)/6)),rk:p.kind==='prospect',inj:p.status&&p.status!=='ACTIVE'}));
  const mineBase=S.map(p=>Object.assign({},p,{ef:kef(p)}));
  let seasonSum=0, futureSum=0; const pickFreq=mine.map(()=>new Map()), avail=new Map(), availN=[0,0,0];
  for(let s=0;s<N;s++){
    const gone=new Uint8Array(base.length), goneO=new Uint8Array(base.length); const my=mineBase.slice(); let mi=0;
    for(const x of seq){
      if(x.team===myId){
        let lv0=lineupValue(withRepl(my)).value, t0=ktop5(my), bestI=-1, bv=-1e9, seen=0;
        for(let i=0;i<base.length&&seen<30;i++){ if(gone[i]) continue; seen++; const p=base[i].p;
          const v=73*(lineupValue(withRepl(my.concat([p]))).value-lv0)+w*73*(ktop5(my.concat([p]))-t0);
          if(v>bv){bv=v;bestI=i;} }
        if(mi<3) released.forEach(r=>{ const idx=base.findIndex(b=>b.p.id===r.id); const rec=avail.get(r.id)||[0,0,0]; if(idx<0||!goneO[idx]) rec[mi]++; avail.set(r.id,rec); });
        if(bestI>=0){ gone[bestI]=1; my.push(base[bestI].p); const f=pickFreq[mi]; f.set(base[bestI].p.name,(f.get(base[bestI].p.name)||0)+1); }
        mi++;
      } else {
        const T=tr.get(x.team)||null; let bi=-1,bv=-1e9,seen=0;
        for(let i=0;i<base.length&&seen<40;i++){ if(gone[i]) continue; seen++; const b=base[i];
          let u=-seen; if(T){ u+=3.0*T.youth*b.yn+2.0*T.rookie*(b.rk?1:0)+2.0*T.injury*(b.inj?1:0); }
          u+=gum()*(1.5+0.12*seen); if(u>bv){bv=u;bi=i;} }
        if(bi>=0){ gone[bi]=1; goneO[bi]=1; }
      }
    }
    seasonSum+=73*lineupValue(withRepl(my)).value; futureSum+=ktop5(my);
  }
  const top=pickFreq.map(f=>[...f.entries()].sort((a,b)=>b[1]-a[1]).slice(0,3).map(([n,c])=>({name:n,pct:c/N})));
  const av={}; avail.forEach((v,k)=>{ av[k]=v.map(c=>c/N); });
  return {season:seasonSum/N,future:futureSum/N,top,avail:av,picks:mine.map(x=>`Rd ${x.k}.${x.pos}`)};
}
function kCombos(arr,k){ const out=[]; const go=(st,cur)=>{ if(cur.length===k){ out.push(cur.slice()); return; } for(let i=st;i<arr.length;i++){ cur.push(arr[i]); go(i+1,cur); cur.pop(); } }; go(0,[]); return out; }

function kCompute(M,K,w,forceSet){
  const myTeam=DR.teams.find(t=>t.id===DR.my_id);
  const roster=myTeam.roster.map(r=>M.all.get(String(r.id))).filter(Boolean).map(p=>Object.assign({},p,{ef:kef(p)}));
  const cand=roster.slice().sort((a,b)=>(b.ef*0.6+(b.asset5||0)*0.25)-(a.ef*0.6+(a.asset5||0)*0.25)).slice(0,Math.max(K+5,11));
  const sets=kCombos(cand,K).map(S=>({S,quick:73*lineupValue(withRepl(S)).value+w*73*ktop5(S)})).sort((a,b)=>b.quick-a.quick);
  const chosen=sets.slice(0,8); const sig=x=>x.S.map(p=>p.id).sort().join(',');
  if(forceSet&&!chosen.some(x=>sig(x)===forceSet.map(p=>p.id).sort().join(','))) chosen.push({S:forceSet,quick:0});
  chosen.forEach((x,i)=>{ x.sim=kDraftSim(M,x.S,w,28,1000+i); x.total=x.sim?x.sim.season+w*73*x.sim.future:x.quick; });
  chosen.sort((a,b)=>b.total-a.total);
  return {roster,chosen};
}

function renderKeepers(){
  const pane=document.getElementById('keepersPane');
  const M=draftModel();
  const K=kK||(DR.draft.keepers_now||3);
  const myTeam=DR.teams.find(t=>t.id===DR.my_id);
  const roster=myTeam.roster.map(r=>M.all.get(String(r.id))).filter(Boolean);
  const real=M.real&&roster.some(p=>M.kept.get(p.id)===DR.my_id);
  if(kSel===null){ try{ kSel=JSON.parse(localStorage.getItem('keepSel')||'null'); }catch(e){ kSel=null; } }
  const sel=(kSel||[]).filter(id=>roster.some(p=>p.id===id)).slice(0,K);
  const dl=DR.draft.keeper_deadline_ms, left=dl?(dl-Date.now()):null;
  const dlTxt=dl?(left>0?`due ${new Date(dl).toLocaleString([], {weekday:'short',month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'})} (${left>3600000?Math.floor(left/3600000)+' hours left':Math.max(1,Math.floor(left/60000))+' minutes left'})`:'the keeper deadline has passed'):'';
  const selKey=sel.slice().sort().join(',');
  const sig=[K,kW,selKey,M.kept.size,M.real,roster.length].join('|');
  pane.innerHTML=`<div class="controls"><span class="hint">Keepers ${dlTxt}. ${M.real?'ESPN shows the real keepers now.':'Other teams\' keepers are <b>projected</b> (each team\'s top 3 by asset) until ESPN records them.'}</span></div>
    <div class="hint" style="padding:1rem">Simulating drafts for each keeper set…</div>`;
  const run=()=>{
    let res=kCache.sig===sig?kCache.res:null;
    if(!res){ const forceSet=sel.length===K?sel.map(id=>roster.find(p=>p.id===id)).map(p=>Object.assign({},p,{ef:kef(p)})):null; res=kCompute(M,K,kW,forceSet); kCache={sig,res}; }
    const best=res.chosen[0];
    const active=(sel.length===K?res.chosen.find(x=>x.S.map(p=>p.id).sort().join(',')===selKey):null)||best;
    const activeIds=new Set(active.S.map(p=>p.id)), checked=sel.length?new Set(sel):activeIds;
    const INJL=['Low','Below typical','Typical','Elevated','High'];
    const fmt=(v,d=0)=>v==null?'<span class="hint">—</span>':Number(v).toFixed(d);
    const av=active.sim?active.sim.avail:{};
    const pickNs=active.sim?active.sim.picks:[];
    const rows=res.roster.slice().sort((a,b)=>(b.asset5||0)-(a.asset5||0)).map(p=>{
      const h=p.hub, tier=h&&h.injury_tier!=null?h.injury_tier:null, miss=kmiss(p);
      const a=av[p.id];
      const chip=tier!=null?`<span class="injTier t${tier}" title="${esc(((h.injury_tags||[]).join('; '))||'')}">${INJL[tier]}</span> <span class="hint">~${miss} g</span>`:'<span class="hint">—</span>';
      const draftNote=activeIds.has(p.id)?'<span class="hint">kept</span>':(a?`${a.map((v,i)=>`${pickNs[i]}: <b>${Math.round(v*100)}%</b>`).join(' · ')}`:'<span class="hint">—</span>');
      return `<tr class="${activeIds.has(p.id)?'kSel':''}"><td class="cbc"><input type="checkbox" class="kcb" data-id="${p.id}" ${checked.has(p.id)?'checked':''} ${real?'disabled':''}/></td>
        <td style="text-align:left"><b>${esc(p.name)}</b>${p.kind==='prospect'?' <span class="kind rookie">ROOKIE</span>':''} <span class="hint">${esc(p.team)}</span></td>
        <td class="num">${p.age!=null?p.age.toFixed(1):'—'}</td><td>${esc(p.pos||'')}</td><td class="num">${fmt(p.espn||p.ours,1)}</td><td class="num">${fmt(kef(p),1)}</td>
        <td class="num">${p.asset5?p.asset5.toFixed(0):'—'}</td><td class="num">${p.mkt!=null?'#'+p.mkt:'—'}</td><td style="text-align:left">${chip}</td><td style="text-align:left;white-space:normal">${draftNote}</td></tr>`;}).join('');
    const setRows=res.chosen.slice(0,8).map((x,i)=>{
      const isSel=x===active;
      return `<tr class="${isSel?'kSel':''}"><td class="num">${i+1}</td><td style="text-align:left;white-space:normal">${x.S.map(p=>esc(p.name)).join(' + ')}${i===0?' <span class="liveStatus">best</span>':''}${isSel&&i!==0?' <span class="liveStatus" title="your selection">yours</span>':''}</td>
        <td class="num">${x.sim?x.sim.season.toFixed(0):'—'}</td><td class="num">${x.sim?x.sim.future.toFixed(0):'—'}</td><td class="num"><b>${x.total.toFixed(0)}</b></td><td class="num ${x.total-best.total<-0.5?'':'hint'}">${(x.total-best.total).toFixed(0)}</td></tr>`;}).join('');
    // sensitivity: same simulated sets, different weight on the future
    const sens=[0.05,0.25,0.5].map(w=>{ const bs=res.chosen.slice().sort((a,b)=>(b.sim.season+w*73*b.sim.future)-(a.sim.season+w*73*a.sim.future))[0]; return `<div class="kSens"><b>${w===0.05?'Win-now (0.05)':w===0.25?'Balanced (0.25)':'Future-heavy (0.50)'}</b>: ${bs.S.map(p=>esc(p.name)).join(' + ')}</div>`; }).join('');
    const top=active.sim?active.sim.top:[];
    const draftHtml=top.length?`<div class="kDraft">${top.map((t,i)=>`<div><b>${pickNs[i]}</b> <span class="hint">most likely:</span> ${t.map(x=>`${esc(x.name)} <span class="hint">${Math.round(x.pct*100)}%</span>`).join(', ')}</div>`).join('')}</div>`:'';
    const gap=active.total-best.total;
    pane.innerHTML=`<div class="controls"><span class="hint">Keepers ${dlTxt}. ${M.real?'ESPN shows the real keepers now.':'Other teams\' keepers are <b>projected</b> (each team\'s top 3 by asset) until ESPN records them.'}</span></div>
      <div class="controls" style="gap:1rem"><label class="kbox" style="gap:.5rem"><span>Keepers to choose:</span><select id="kK">${[3,5].map(n=>`<option value="${n}" ${n===K?'selected':''}>${n}${n===(DR.draft.keepers_now||3)?' (this year)':' (future years)'}</option>`).join('')}</select></label>
        <label class="kbox" style="gap:.5rem;flex:1;min-width:220px"><span>Win now</span><input type="range" id="kW" min="0" max="0.6" step="0.05" value="${kW}" style="flex:1"/><span>Future</span><b id="kWv">${kW.toFixed(2)}</b></label>
        ${sel.length?'<button class="dbtn" id="kReset" type="button">Use the recommended set</button>':''}</div>
      <div class="statbar" style="margin-bottom:1rem"><div><b>${active.sim?active.sim.season.toFixed(0):'—'}</b>expected season points (with the draft)</div><div><b>${active.sim?active.sim.future.toFixed(0):'—'}</b>next-year top-5 asset total</div>
        <div><b>${active.total.toFixed(0)}</b>total (w = ${kW.toFixed(2)})</div><div><b style="color:${gap<-0.5?'var(--warn)':'var(--good)'}">${gap<-0.5?gap.toFixed(0):'best'}</b>${gap<-0.5?'vs the best set':'your set is the best found'}</div></div>
      ${sel.length&&sel.length<K?`<div class="legend" style="margin:0 0 1rem">You have ${sel.length} of ${K} ticked: tick ${K-sel.length} more to see your set compared with the best. Until then the numbers above are for the best set.</div>`:''}
      ${sel.length===K&&active!==best?`<div class="legend" style="margin:0 0 1rem"><b>Your set vs the best:</b> ${active.S.map(p=>esc(p.name)).join(', ')} is ${Math.abs(gap).toFixed(0)} points behind ${best.S.map(p=>esc(p.name)).join(', ')} on this weighting.</div>`:''}
      <div style="font-family:'Barlow Condensed',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin:.4rem 0">Your roster: tick ${K} to keep</div>
      <div class="tablewrap" style="margin-bottom:1.2rem"><table class="kTbl"><thead><tr><th class="cbh">Keep</th><th style="text-align:left">Player</th><th>Age</th><th style="text-align:left">Pos</th><th>ESPN proj</th><th>Adj proj</th><th>Keeper value</th><th>MKT</th><th style="text-align:left">Injury risk</th><th style="text-align:left">If not kept: chance other teams leave him at your pick</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div style="font-family:'Barlow Condensed',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin:.4rem 0">Best keeper sets (each with a simulated draft)</div>
      <div class="tablewrap" style="margin-bottom:1rem"><table><thead><tr><th>Rank</th><th style="text-align:left">Keepers</th><th>Season pts</th><th>Future assets</th><th>Total</th><th>Gap</th></tr></thead><tbody>${setRows}</tbody></table></div>
      <div style="font-family:'Barlow Condensed',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin:.4rem 0">Does the answer change with the weighting?</div>
      <div class="irBox">${sens}</div>
      ${draftHtml?`<div style="font-family:'Barlow Condensed',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin:.4rem 0">Who this set drafts (simulated)</div><div class="irBox">${draftHtml}</div>`:''}
      <div class="legend" style="margin-top:1rem"><b>How to use this page.</b> Tick the keepers you are considering (the page starts from the best set it found). <b>Adj proj</b> is ESPN's projected points per game times the games he is expected to be available (injury tier model). <b>Season pts</b> = your best lineup (10 slots, position-eligible) from the keepers plus the players a simulated draft gives you at your picks, times 73 games. <b>Future assets</b> = the top-5 next-year keeper asset values in that group. <b>Total</b> adds season points and the future weight (the slider: the same 1 asset point = 73 points of output used elsewhere). "Chance other teams leave him at your pick" is for a player you would NOT keep: whether you could draft him back (it counts only the other teams' picks). Pick labels are draft round and slot: Rd 1.1 is your first pick. If he is likely gone, keeping him is the only way to hold him. Other teams' keepers are projected until ESPN shows them, so re-check after the deadline; the simulation uses each owner's draft tendencies but cannot know surprises.</div>`;
    document.getElementById('kK').addEventListener('change',e=>{ kK=+e.target.value; kSel=null; try{localStorage.removeItem('keepSel');}catch(_){} renderKeepers(); });
    const kw=document.getElementById('kW'); kw.addEventListener('input',e=>{ document.getElementById('kWv').textContent=(+e.target.value).toFixed(2); });
    kw.addEventListener('change',e=>{ kW=+e.target.value; renderKeepers(); });
    const rs=document.getElementById('kReset'); if(rs) rs.addEventListener('click',()=>{ kSel=null; try{localStorage.removeItem('keepSel');}catch(_){} renderKeepers(); });
    pane.querySelectorAll('.kcb').forEach(cb=>cb.addEventListener('change',e=>{
      const cur=new Set(sel.length?sel:active.S.map(p=>p.id)); if(e.target.checked) cur.add(e.target.dataset.id); else cur.delete(e.target.dataset.id);
      kSel=[...cur].slice(0,K); if(cur.size>K){ kSel=[...cur].slice(-K); } try{localStorage.setItem('keepSel',JSON.stringify(kSel));}catch(_){} renderKeepers(); }));
    mobileTables(pane); collapseLegends(pane);
  };
  setTimeout(run,30);
}

let dLimit=60;
let DLS={ok:null,at:null,err:null,filled:0,sim:false,fails:0};
function liveStatHtml(){
  const tot=(DR&&DR.draft&&DR.draft.picks)?DR.draft.picks.filter(x=>x.r>(DR.draft.keepers_now||3)).length:0, hh=DLS.at?DLS.at.toLocaleTimeString():'';
  if(DLS.ok===false&&!dLive) return `<span class="liveStatus" style="background:var(--warn);color:#fff">No live connection</span> <span class="hint">retrying every 5 s (${esc(DLS.err||'')}). Ticking Me / Oth by hand still works.</span>`;
  if(!dLive) return '';
  if(DLS.ok===false) return `<span class="liveStatus" style="background:var(--warn);color:#fff">Connection lost</span> <span class="hint">last update ${hh}; retrying (${esc(DLS.err||'')})</span>`;
  const lab=DLS.sim?'<span class="liveStatus" style="background:var(--accent);color:var(--on-accent)">TEST: simulated picks</span>':'<span class="liveStatus" style="background:var(--good);color:#fff">LIVE from ESPN</span>';
  const st=DLS.err?`<span class="liveStatus" style="background:var(--warn);color:#fff" title="${esc(DLS.err)}">ESPN not answering</span> `:'';
  const wait=(!DR.draft.in_progress&&!DLS.filled)?' · connected, waiting for the draft to start':'';
  return `${lab} ${st}<span class="hint">${DLS.filled} of ${tot} picks made${wait} · checked ${hh}</span>`;
}
async function pollDraftLive(){
  if(window.__noLive) return;
  try{
    const r=await fetch('draft_live.json?_='+Date.now());
    if(r.status===404){ window.__noLive=true; return; }          // GitHub Pages has no live server: stay quiet
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    DLS={ok:true,at:new Date(),err:j.error||null,filled:j.filled||0,sim:!!j.simulated,fails:0};
    if(!j.picks) return; dLive=true; let changed=false;
    const byN=new Map(j.picks.map(x=>[x.n,x]));
    DR.draft.picks.forEach(x=>{ const y=byN.get(x.n); if(y&&(y.player!==x.player||y.keeper!==x.keeper)){ x.player=y.player; x.keeper=y.keeper; changed=true; } });
    const was=DR.draft.in_progress; DR.draft.in_progress=!!j.inProgress; if(was!==DR.draft.in_progress) changed=true;
    if(changed&&document.getElementById('draftPane').style.display!=='none') renderDraft();
  }catch(e){ DLS.ok=false; DLS.err=String(e&&e.message||e); DLS.fails=(DLS.fails||0)+1; }
  const el=document.getElementById('dLiveStat'); if(el) el.innerHTML=liveStatHtml();
}

/* ===== League > Standings: the landscape in one table (record, scoring, luck, strength, cap use, this week, playoff and title odds with a trend line) */
let OH;   // odds_history.json: {days:{date:{ABBR:[playoffs,title]}}}
/* points per week a team is missing to injuries: its best 10 (by rest-of-season points per game) with everyone healthy, minus its best 10 once each injured
   player is scaled by the share of the next 7 days' games he is expected to miss, times about 4 games a week. A star counts in full; a bench player out barely counts. */
function injBurden(teamId){
  if(!L||!RD) return null;
  const t=L.teams.find(x=>x.id===teamId); if(!t) return null;
  if(!RD._byId) RD._byId=new Map(RD.players.map(p=>[p.id,p]));
  const pl=t.roster.map(r=>{ const p=RD._byId.get(r.espn_id); const ppg=p?p.ppg||0:0;
    const out=r.slot==='IR'||r.injury==='OUT'||(p&&p.games_out>0);
    let share=0; if(out){ const g7=p&&p.g7?p.g7:3; share=p&&p.games_out!=null&&p.games_out>0?Math.min(1,p.games_out/g7):1; }
    return {ppg,avail:ppg*(1-share)}; });
  const top=a=>a.slice().sort((x,y)=>y-x).slice(0,10).reduce((u,v)=>u+v,0);
  return Math.max(0,(top(pl.map(x=>x.ppg))-top(pl.map(x=>x.avail)))*4);
}
let stSort={k:'rec',asc:false};
function renderStandings(){
  const pane=document.getElementById('standingsPane');
  if(!ODDS||!W){ pane.innerHTML='<div class="hint" style="padding:1rem">Loading…</div>'; return; }
  if(OH===undefined){ OH=null; fetch('odds_history.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(x=>{ OH=x; if(activeView()==='standings') renderStandings(); }).catch(()=>{}); }
  if(TU===undefined){ TU=null; fetch('team_usage.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(x=>{ TU=x; if(activeView()==='standings') renderStandings(); else if(activeView()==='teams'&&L&&D) renderTeams(); }).catch(()=>{}); }
  const pctf=v=>v==null?'—':(v>=0.995?'>99%':(v<0.005&&v>0?'<1%':(v*100).toFixed(0)+'%'));
  const days=OH&&OH.days?Object.keys(OH.days).sort():[];
  const recent=days.slice(-28), wkAgo=days.length?days.filter(d=>d<=new Date(Date.now()-7*864e5).toISOString().slice(0,10)).slice(-1)[0]:null;
  const rows=ODDS.teams.map(o=>{
    const wt=W.teams.find(x=>x.id===o.id)||{}, op=wt.opp!=null?W.teams.find(x=>x.id===wt.opp):null;
    const g=(o.res||[]).length, sp=SP&&SP.teams?SP.teams.find(x=>x.id===o.id):null, cw=SP?SP.current_week:1;
    const pw=sp&&sp.proj?[0,1,2,3].map(i=>sp.proj[String(cw+i)]).filter(v=>v!=null):[];
    const use=TU&&TU.rows?TU.rows.filter(r=>r.team===o.id&&r.y===W.season):[];            // this season's completed matchups only
    const st0=use.reduce((t,r)=>t+r.total,0)+(wt.starts_so_far||0), pts0=(o.pf||0)+(wt.pts_so_far||0);
    const pps=st0>0?pts0/st0:null;                                                                 // completed matchups plus the one in progress
    const apN=(o.ap_w||0)+(o.ap_l||0), apPct=apN?o.ap_w/apN:null;
    const trend=recent.map(d=>(OH.days[d][o.abbrev]||[])[1]).filter(v=>v!=null);
    const prev=wkAgo&&OH.days[wkAgo][o.abbrev]?OH.days[wkAgo][o.abbrev][1]:null;
    return {o,wt,op,g,name:wt.name||o.abbrev,me:o.id===ODDS.my_id,
      ppw:g?o.pf/g:null, papw:g?o.pa/g:null, apPct, luck:apPct!=null?o.wins+0.5*(o.t||0)-apPct*g:null,
      projW:pw.length?pw.reduce((a,b)=>a+b,0)/pw.length:null, useAvg:use.length?use.reduce((t,r)=>t+r.total/r.cap*40,0)/use.length:null,
      trend, dT:prev!=null?o.title-prev:null, pps, inj:injBurden(o.id)};
  }).sort((a,b)=>(b.o.wins+0.5*(b.o.t||0))-(a.o.wins+0.5*(a.o.t||0))||(b.o.pf-a.o.pf)||(b.o.made-a.o.made));
  const nPO=(ODDS.teams[0].seed||[]).length||6;
  const spark=(v,col)=>{ if(v.length<2) return ''; const W2=84,H2=24,mx=Math.max(...v,0.01); return `<svg width="${W2}" height="${H2}" viewBox="0 0 ${W2} ${H2}" aria-hidden="true" style="vertical-align:middle"><polyline fill="none" stroke="${col}" stroke-width="1.8" points="${v.map((x,i)=>`${(i/(v.length-1)*(W2-4)+2).toFixed(1)},${(H2-2-x/mx*(H2-4)).toFixed(1)}`).join(' ')}"/></svg>`; };
  const sg=(v,d=0)=>(v>=0?'+':'')+v.toFixed(d);
  const body=rows.map((r,i)=>{ const o=r.o, wt=r.wt, op=r.op;
    const rec=`${o.wins}-${o.l||0}${o.t?'-'+o.t:''}`;
    const live=wt.pts_so_far!=null&&op?`<b>${wt.pts_so_far.toFixed(0)}</b>–${op.pts_so_far.toFixed(0)} <span class="hint">vs ${esc(op.abbrev)} · ${wt.win_prob!=null?Math.round(wt.win_prob*100)+'%':''}</span>`:'—';
    const col=r.dT==null?'var(--ink-soft)':(r.dT>=0.005?'var(--good)':(r.dT<=-0.005?'var(--warn)':'var(--ink-soft)'));
    return `<tr class="${r.me?'meRow':''}${i===nPO-1?' cutRow':''}" data-team="${esc(o.abbrev)}">
      <td class="num">${i+1}</td><td style="text-align:left"><b>${esc(o.abbrev)}</b> <span class="hint">${esc(r.name)}</span>${o.clinch==='bye'?' <span class="clTag">clinched bye</span>':(o.clinch==='playoffs'?' <span class="clTag">clinched playoffs</span>':'')}${o.elim?' <span class="clTag out">eliminated</span>':''}</td>
      <td class="num" data-sort="${o.wins+0.5*(o.t||0)+o.pf/1e7}"><b>${rec}</b></td><td class="num" data-sort="${o.exp_wins}">${o.exp_wins!=null?`${Math.round(o.exp_wins)}-${Math.max(0,19-Math.round(o.exp_wins))}`:'—'}</td><td style="text-align:left" data-sort="${o.streak?(o.streak[0]==='W'?1:-1)*+o.streak.slice(1):0}">${o.streak||'—'}</td>
      <td class="num">${r.ppw!=null?r.ppw.toFixed(0):'—'}</td><td class="num">${r.papw!=null?r.papw.toFixed(0):'—'}</td>
      <td class="num" data-sort="${r.apPct??''}">${r.apPct!=null?`${(o.ap_w).toFixed(0)}-${(o.ap_l).toFixed(0)}`:'—'}</td>
      <td class="num" data-sort="${r.luck??''}">${r.luck!=null?`<span style="color:${r.luck>=0.5?'var(--good)':(r.luck<=-0.5?'var(--warn)':'inherit')}">${sg(r.luck,1)}</span>`:'—'}</td>
      <td class="num">${r.projW!=null?r.projW.toFixed(0):'—'}</td><td class="num">${r.useAvg!=null?r.useAvg.toFixed(1):'—'}</td><td class="num">${r.pps!=null?r.pps.toFixed(1):'—'}</td><td class="num" data-sort="${r.inj??''}">${r.inj!=null?(r.inj<0.5?'0':r.inj.toFixed(0)):'—'}</td>
      <td style="text-align:left;white-space:nowrap" data-sort="${wt.win_prob??''}">${live}</td>
      <td class="num" data-sort="${o.made}"><b>${pctf(o.made)}</b></td><td class="num" data-sort="${o.bye}">${pctf(o.bye)}</td><td class="num" data-sort="${o.title}"><b>${pctf(o.title)}</b></td>
      <td style="text-align:left;white-space:nowrap" data-sort="${r.dT??''}">${spark(r.trend,col)} <span class="num" style="color:${col}">${r.dT!=null?sg(r.dT*100,1):''}</span></td></tr>`; }).join('');
  // headline tiles: only the ones the season has data for yet
  const tiles=[];
  const fav=rows.slice().sort((a,b)=>b.o.title-a.o.title)[0]; tiles.push(['Title favorite',`${esc(fav.o.abbrev)} ${pctf(fav.o.title)}`]);
  const played=rows.filter(r=>r.g>0);
  if(played.length){
    const best=played.slice().sort((a,b)=>b.ppw-a.ppw)[0]; tiles.push(['Top scorer',`${esc(best.o.abbrev)} ${best.ppw.toFixed(0)}/wk`]);
    const lk=played.slice().sort((a,b)=>b.luck-a.luck); if(Math.abs(lk[0].luck)>=0.5) tiles.push(['Luckiest',`${esc(lk[0].o.abbrev)} ${sg(lk[0].luck,1)} wins`]); if(lk[lk.length-1].luck<=-0.5) tiles.push(['Unluckiest',`${esc(lk[lk.length-1].o.abbrev)} ${sg(lk[lk.length-1].luck,1)} wins`]);
    let hi=null; played.forEach(r=>(r.o.res||[]).forEach(x=>{ if(!hi||x.pf>hi.pf) hi={pf:x.pf,ab:r.o.abbrev,w:x.w}; })); if(hi) tiles.push(['High score',`${hi.pf.toFixed(0)} · ${esc(hi.ab)} wk ${hi.w}`]);
  } else {
    const strong=rows.filter(r=>r.projW!=null).sort((a,b)=>b.projW-a.projW)[0]; if(strong) tiles.push(['Strongest roster',`${esc(strong.o.abbrev)} ${strong.projW.toFixed(0)}/wk`]);
  }
  const mv=rows.filter(r=>r.dT!=null).sort((a,b)=>Math.abs(b.dT)-Math.abs(a.dT))[0]; if(mv&&Math.abs(mv.dT)>=0.01) tiles.push(['Biggest mover (7 days)',`${esc(mv.o.abbrev)} title ${sg(mv.dT*100,1)} pts`]);
  // phones: one row per team in the shared list style; the big number follows the sort (Title odds when sorted by record)
  const SK={rec:['Record',r=>r.o.wins+0.5*(r.o.t||0)+r.o.pf/1e7],title:['Title',r=>r.o.title],made:['Playoffs',r=>r.o.made],projW:['Proj pts/wk',r=>r.projW],ppw:['Pts/wk',r=>r.ppw],pps:['PPS',r=>r.pps],luck:['Luck',r=>r.luck],inj:['Inj pts/wk',r=>r.inj]};
  let listHtml='';
  if(isMobile()){

    const keyOf=r=>({title:[pctf(r.o.title),'Title'],made:[pctf(r.o.made),'Playoffs'],projW:[r.projW!=null?r.projW.toFixed(0):'—','Proj pts/wk'],ppw:[r.ppw!=null?r.ppw.toFixed(0):'—','Pts/wk'],pps:[r.pps!=null?r.pps.toFixed(1):'—','Pts/start'],
      luck:[r.luck!=null?sg(r.luck,1):'—','Luck'],inj:[r.inj!=null?(r.inj<0.5?'0':r.inj.toFixed(0)):'—','Inj pts/wk']})[stSort.k]||[pctf(r.o.title),'Title'];
    listHtml=lst.map((r,i)=>{ const o=r.o, wt=r.wt, op=r.op, k=keyOf(r);
      const col=r.dT==null?'':(r.dT>=0.005?'up':(r.dT<=-0.005?'down':''));
      const tag=o.clinch==='bye'?chip('Clinched bye','good'):(o.clinch==='playoffs'?chip('Clinched','good'):(o.elim?chip('Out'):''));
      const wk=wt.pts_so_far!=null&&op?`This week <b>${wt.pts_so_far.toFixed(0)}–${op.pts_so_far.toFixed(0)}</b> vs ${esc(op.abbrev)}${wt.win_prob!=null?' · '+Math.round(wt.win_prob*100)+'%':''}`:'';
      const row=tmRow({rank:stSort.k==='rec'&&!stSort.asc?i+1:rows.indexOf(r)+1,abbrev:o.abbrev,name:r.name,me:r.me,attr:`data-team="${esc(o.abbrev)}"`,chips:[tag],meta:wk,
        stats:[[`${o.wins}-${o.l||0}${o.t?'-'+o.t:''}`,'record'],[pctf(o.made),'playoffs'],[r.pps!=null?r.pps.toFixed(1):null,'PPS'],[stSort.k==='title'?null:(r.dT!=null&&Math.abs(r.dT)>=0.001?sg(r.dT*100,1):null),'title 7d',col]],
        key:{v:k[0],l:k[1],cls:k[1]==='Luck'&&r.luck!=null?(r.luck>=0.5?'up':(r.luck<=-0.5?'down':'')):''}});
      return row+(stSort.k==='rec'&&!stSort.asc&&i===nPO-1?'<div class="tmCut">Playoff line</div>':''); }).join('');
  }
  pane.innerHTML=`<div class="controls"><span class="hint">Week ${ODDS.current_week} of 19 · ${ODDS.weeks_left} regular-season matchups left · top ${nPO} make the playoffs</span></div>

/* Refresh plan: starts the cloud plan build (refresh-gameday.yml) with the same GitHub key the Set lineup panel uses, waits for the new
   week_plan.json commit, and loads it straight from the repository (the public site catches up a minute later when it redeploys). */
const PR={busy:false,msg:''};
/* ONE-TAP MOVES (2026-10-25): a Do now move due today gets a button that makes it in ESPN through the roster-move workflow (same GitHub token as Set lineup).
   The workflow re-checks the move against the newest plan and ESPN, sends one transaction (add + drop together), verifies it, and starts a plan rebuild. */
const MV_BASE='https://raw.githubusercontent.com/pitchafwa/delegation-hub/move-data/';
const MV={};   // key -> {busy, msg, ok}
const mvKey=m=>`${m.add}:${m.drop}:${m.kind}`;
function mvButton(m){
  const st=MV[mvKey(m)]||{}, label=m.kind==='waiver'?'Claim in ESPN':'Add in ESPN';
  const btn=st.ok?'':`<button type="button" class="doBtn" data-mv="${esc(JSON.stringify(m))}" ${st.busy?'disabled':''}>${st.busy?'Working…':label}</button>`;
  return `<span class="doAct">${btn}${st.msg?`<span class="doMsg${st.ok===false?' bad':(st.ok?' good':'')}">${st.msg}</span>`:''}</span>`;
}
async function mvRun(m){
  const k=mvKey(m), set=(o)=>{ MV[k]=Object.assign(MV[k]||{},o); if(activeView()==='week') renderWeek(); };
  if(!slTok()){ set({ok:false,msg:'Needs the GitHub token from Set lineup in ESPN (one-time setup).'}); return; }
  const q=m.kind==='waiver'?`Put in a waiver claim for ${m.name}${m.dropName?`, dropping ${m.dropName} if it goes through`:''}?`:`Add ${m.name}${m.dropName?` and drop ${m.dropName}`:''} in ESPN now?`;
  if(!confirm(q)) return;
  const rid=Date.now().toString(36)+Math.random().toString(36).slice(2,6), t0=Date.now();
  set({busy:true,ok:undefined,msg:'Sending…'});
  try{
    const r=await fetch(`https://api.github.com/repos/${SL_REPO}/actions/workflows/roster-move.yml/dispatches`,{method:'POST',headers:Object.assign(ghH(),{'Content-Type':'application/json'}),body:JSON.stringify({ref:'main',inputs:{add:String(m.add),drop:String(m.drop||''),kind:m.kind,rid}})});
    if(r.status!==204) throw new Error(r.status===401||r.status===403?'GitHub rejected the token (it may have expired, or lacks Actions write access).':'GitHub returned status '+r.status);
  }catch(e){ set({busy:false,ok:false,msg:esc(e.message)}); return; }
  set({msg:'Checking the move and sending it to ESPN (about a minute)…'});
  for(let i=0;i<36;i++){
    await new Promise(res=>setTimeout(res,5000));
    try{ const j=await (await fetch(MV_BASE+'move_result.json?t='+Date.now(),{cache:'no-store'})).json();
      if(j&&j.rid===rid){ set({busy:false,ok:!!j.ok,msg:esc(j.message)+(j.run?` <a href="${esc(j.run)}" target="_blank" rel="noopener">log</a>`:'')}); return; } }catch(e){}
  }
  set({busy:false,ok:false,msg:'No answer after 3 minutes. Check the ESPN app before trying again.'});
}

async function planRefresh(){

  PR.busy=true; PR.msg=''; renderStamp();
  const t0=Date.now(), say=m=>{ PR.msg=m; renderStamp(); };
  try{
    const r=await fetch(`https://api.github.com/repos/${SL_REPO}/actions/workflows/refresh-gameday.yml/dispatches`,{method:'POST',headers:Object.assign(ghH(),{'Content-Type':'application/json'}),body:JSON.stringify({ref:'main'})});
    if(r.status!==204) throw new Error(r.status===401||r.status===403?'GitHub rejected the key (it needs Actions read and write on this repository).':'GitHub returned status '+r.status);
    let done=false;
    for(let i=0;i<36&&!done;i++){
      await new Promise(res=>setTimeout(res,10000));
      say(`Rebuilding with your current ESPN roster… ${Math.round((Date.now()-t0)/1000)}s (usually about 2 minutes)`);

      const top=c&&c[0], when=top?Date.parse(top.commit.committer.date):0;

    if(done) setTimeout(()=>{ if(!PR.busy){ PR.msg=''; renderStamp(); } },15000);
  }catch(e){ PR.busy=false; say(`<span style="color:var(--warn)">${esc(e.message)}</span>`); }
}

loadLive(); setInterval(loadLive,120000);
fetch('playoff_odds.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(x=>{ if(x&&x.teams){ODDS=x; if(activeView()==='week'||activeView()==='standings') setView(activeView()); if(activeView()==='redraft'&&RD) renderRedraft(); if(activeView()==='teams') renderTeams();} }).catch(()=>{});
fetch('redraft_data.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(x=>{ if(x&&x.players){RD=x; renderNav(); renderStamp(); if(activeView()==='standings') renderStandings(); if(activeView()==='redraft') renderRedraft(); if(activeView()==='teams'&&L&&D) renderTeams();} }).catch(()=>{});
fetch('schedule_plan.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(x=>{ if(x&&x.nba){SP=x; if(activeView()==='sched'||activeView()==='week') setView(activeView()); if(activeView()==='redraft'&&RD) renderRedraft(); if(activeView()==='teams'&&L&&D) renderTeams();} }).catch(()=>{});
fetch('hub_data.json',{cache:'no-cache'}).then(r=>r.json()).then(data=>{
  D=data;
  document.getElementById('hSub').innerHTML = (D.ctx_mode==='carry' ? '<b style="color:var(--warn)">VARIANT: for incoming rookies the team-situation boost applies to year 1 only, and that boosted year-1 level is the baseline for every later season (no fade).</b> ' : '') + D.note;
  document.getElementById('foot').textContent += ` Generated ${new Date(D.generated).toLocaleString()}.`;
  fetch('league_rosters.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(l=>{ if(l&&l.teams){L=l; if(activeView()==='standings') renderStandings(); initLeague(); render(); if(RD) RD._own=null; if(activeView()==='teams') setView('teams'); if(RD) renderRedraft();} }).catch(()=>{});
  fetch('draft_data.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(d=>{ if(d&&d.draft){DR=d; if(activeView()==='draft') setView('draft'); if(activeView()==='keepers') setView('keepers'); pollDraftLive(); setInterval(pollDraftLive,5000);} }).catch(()=>{});
  fetch('team_profiles.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(p=>{ if(p&&p.teams){PROF=p;} }).catch(()=>{});
  fetch('trade_ideas.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(t=>{ if(t&&t.teams){TR=t; if(activeView()==='trades') setView('trades');} }).catch(()=>{});
  fetch('breakout_history.json',{cache:'no-cache'}).then(r=>r.json()).then(h=>{H=h; fillYearSelect(); render();}).catch(()=>{});
  render();
}).catch(err=>{
  document.getElementById('boardPane').innerHTML = `<div class="err">Couldn't load hub_data.json — ${err}</div>`;
});
</script>
</body>
</html>
